# из bolnitsa: .github/workflows/build.yml @ e0a3491 — изменено: имя игры и файла.
# Сборка ПК-версии — только на тег версии vX.Y.Z (ADR студии 0019): слияние в main её не запускает, ручного запуска нет.
# Тег ставит владелец. Пока — только Windows x64, одним zip, из Linux, без wine (как у «Больницы», решение владельца
# №95). Файлы уходят в релиз на этот тег; версии 0.x — пре-релизы. Репозиторий закрыт: релиз видят только участники.
name: Сборка ПК

on:
  push:
    tags: ['v*']

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Windows x64
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5

      # тег — та же версия, что в package.json игры: v0.0.4 при 0.0.3 — ошибка, а не чужой релиз
      - name: Тег и версия
        run: |
          V=$(node -p "require('./package.json').version")
          if [ "$GITHUB_REF_NAME" != "v$V" ]; then
            echo "::error::Тег $GITHUB_REF_NAME, а в package.json версия $V."
            exit 1
          fi

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11

      # Electron и инструменты electron-builder скачиваются один раз и кэшируются
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/electron
            ~/.cache/electron-builder
          key: electron-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - run: npm ci --no-audit --no-fund
      - name: База игры — сборка и валидатор
        run: npm run content
      - name: Типы
        run: npx tsc --noEmit
      - name: Страница и поток расчёта
        run: node tools/app/build.mjs
      - name: Windows x64
        run: npx electron-builder --win --publish never
      - run: ls -la release

      - name: Описание релиза
        run: |
          {
            echo "«Фармзавод» — прототип: что в этой версии — STATUS.md и docs/07-roadmap.md на этом теге."
            echo
            echo "**Windows x64:** \`*-win-x64.zip\` — распаковать в любую папку и запустить \`Farmzavod.exe\`."
            echo
            echo "Сборка не подписана: Windows может спросить «Запустить всё равно?»."
            echo
            echo "Собрано из коммита ${{ github.sha }}, сборка ${{ github.run_number }}."
          } > release.md

      - name: Релиз ${{ github.ref_name }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Фармзавод ${{ github.ref_name }}
          body_path: release.md
          prerelease: ${{ startsWith(github.ref_name, 'v0.') }}
          fail_on_unmatched_files: true
          files: |
            release/Farmzavod-*-win-x64.zip
