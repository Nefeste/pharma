  <!-- из bolnitsa: app/index.html @ e0a3491 — изменено: полоса сверху, отладка и состояние (часть 0); карточка вещи — её стиль `.card`, панель склада — своя (3б); планёрка и касса — свои (3в); лаборатория (3г), расписание (3д), «Кем вы будете» (3е), прогон плана (часть 5) и доска расследования (4б) — свои; ограда панели и шапка большого окна на виду (0.0.37), рычаги, пояснение при первом событии и решение по серии (Б1г) — свои -->
  <style>
    :root {
      --panel: rgba(22, 30, 34, 0.86);
      --panel-2: rgba(36, 48, 54, 0.92);
      --line: rgba(255, 255, 255, 0.14);
      --text: #e9eef0;
      --muted: #9fb0b6;
      --accent: #2fb5c9;
      --red: #d8392b;
      --yellow: #e7b416;
      --green: #4caf6e;
    }
    html, body { margin: 0; height: 100%; background: #2a3236; color: var(--text); font: 13px/1.35 system-ui, "Segoe UI", Roboto, sans-serif; overflow: hidden; }
    #view { position: absolute; inset: 0; touch-action: none; }
    #ui { position: absolute; inset: 0; pointer-events: none; }
    #ui > * { pointer-events: auto; }
    .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; box-shadow: 0 2px 10px rgba(0,0,0,.25); }
    button { font: inherit; color: var(--text); background: var(--panel-2); border: 1px solid var(--line); border-radius: 4px; padding: 3px 9px; cursor: pointer; }
    button:hover:not(:disabled) { border-color: var(--accent); }
    button.on { background: var(--accent); color: #0b1a1e; border-color: var(--accent); }
    button:disabled { opacity: .45; cursor: default; }
    .top { position: absolute; left: 8px; right: 8px; top: 8px; display: flex; flex-wrap: wrap; align-items: center; gap: 10px; padding: 6px 10px; }
    .top .clock { font-size: 16px; font-weight: 600; min-width: 52px; }
    .top .date { color: var(--muted); min-width: 150px; }
    .top .group, .debug .group { display: inline-flex; gap: 4px; align-items: center; }
    .top .stat b { color: #fff; }
    .top .warn { color: var(--yellow); }
    .top .notice { flex: 1 1 0; min-width: 90px; text-align: right; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .label { color: var(--muted); margin: 0 2px 0 8px; }
    .muted { color: var(--muted); }
    .debug { position: absolute; right: 8px; bottom: 10px; padding: 8px 10px; display: flex; flex-direction: column; gap: 6px; max-width: 420px; }
    .status { position: absolute; left: 50%; top: 45%; transform: translate(-50%, -50%); padding: 12px 18px; font-size: 15px; max-width: 70%; text-align: center; }
    .mono { font-variant-numeric: tabular-nums; font-family: ui-monospace, "Cascadia Mono", Consolas, monospace; }
    .num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
    .nowrap { white-space: nowrap; }
    .sicon { vertical-align: -2px; }
    .close { margin-left: auto; }
    /* слои слева (Б1и; геймдизайн, §18): обычный вид, «Загрузка и OEE», «Потоки — люди»; окно и цвета частей словами */
    .layers { position: absolute; left: 8px; top: calc(var(--top-h, 48px) + 8px); width: 176px; padding: 6px 8px; display: flex; flex-direction: column; gap: 3px; }
    .layers .lhead { color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: .04em; }
    .layers > button { text-align: left; }
    .lwin { display: inline-flex; flex-wrap: wrap; gap: 2px; margin: 2px 0; }
    .lwin button { padding: 1px 6px; font-size: 11px; }
    ul.legend, ul.loadrows, .floortip ul { list-style: none; margin: 2px 0; padding: 0; }
    ul.legend li, ul.loadrows li, .floortip li { display: flex; align-items: center; gap: 6px; margin: 1px 0; }
    ul.legend { font-size: 12px; }
    .sw { flex: none; width: 10px; height: 10px; border-radius: 2px; border: 1px solid rgba(255,255,255,.35); }
    .floortip { position: fixed; z-index: 6; pointer-events: none; max-width: 340px; padding: 6px 10px; font-size: 12px; }
    #ui > .floortip { pointer-events: none; }
    /* карточка вещи (3б) — снизу слева: справа — панель склада */
    .card { position: absolute; left: 8px; bottom: 10px; min-width: 380px; max-width: min(600px, calc(100% - 16px)); max-height: 46%; overflow: auto; padding: 8px 12px; }
    /* склад открыт: карточка — слева от него, под панель не заходит */
    .card.beside { min-width: 0; max-width: min(600px, max(300px, calc(100% - min(760px, calc(100% - 16px)) - 24px))); }
    .cardhead { display: flex; align-items: center; gap: 8px; margin-bottom: 4px; font-size: 15px; }
    .card dl { display: grid; grid-template-columns: 1fr 1fr; gap: 2px 14px; margin: 0; }
    .card dt { color: var(--muted); font-size: 11px; }
    .card dd { margin: 0 0 4px; }
    .card .csec { color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: .04em; margin: 8px 0 2px; }
    .card ul.why, .card ol.hist { margin: 0; padding-left: 18px; }
    .card ol.hist { list-style: none; padding-left: 0; }
    .card ol.hist li { margin: 1px 0; }
    /* табель месяца в карточке человека (Б4а): по дням недели — число, отметки формы Т-13, часы */
    .sheet { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 2px; font-size: 11px; margin: 2px 0 6px; }
    .sheet .sd { padding: 1px 3px; border: 1px solid rgba(255,255,255,.08); border-radius: 3px; line-height: 1.3; min-width: 0; }
    .sheet .sd b { color: var(--muted); font-weight: 500; margin-right: 3px; }
    .sheet .sd .sh { display: block; }
    .sheet .sd.over { border-color: var(--yellow); }
    .sheet .sd.rest { color: var(--muted); }
    /* панель склада (3б) — справа под полосой */
    .stock { position: absolute; right: 8px; top: calc(var(--top-h, 48px) + 8px); width: min(760px, calc(100% - 16px)); max-height: calc(100% - var(--top-h, 48px) - 72px); overflow: auto; padding: 8px 10px; display: flex; flex-direction: column; gap: 6px; }
    .phead { display: flex; align-items: baseline; gap: 10px; font-size: 15px; }
    .phead .muted { font-size: 12px; }
    .filters { display: flex; flex-wrap: wrap; gap: 4px; }
    table.grid { border-collapse: collapse; width: 100%; }
    table.grid th { text-align: left; color: var(--muted); font-weight: 500; padding: 3px 6px; border-bottom: 1px solid var(--line); cursor: pointer; white-space: nowrap; }
    table.grid th.sorted { color: var(--text); }
    table.grid td { padding: 3px 6px; border-bottom: 1px solid rgba(255,255,255,.06); }
    table.grid tbody tr { cursor: pointer; }
    table.grid tbody tr:hover { background: rgba(47,181,201,.12); }
    .pager { display: flex; align-items: center; gap: 8px; justify-content: flex-end; }
    .pager .muted { margin-right: auto; }
    .empty { padding: 6px; }
    /* планёрка (3в) — большое окно сверху посередине; касса — справа, как склад */
    .bad { color: #ff8a7a; }
    .warn { color: var(--yellow); }
    .grow { flex: 1 1 auto; }
    .go { cursor: pointer; }
    .go:hover { color: #fff; text-decoration: underline; text-decoration-color: var(--accent); }
    .morning { position: absolute; left: 50%; top: calc(var(--top-h, 48px) + 8px); transform: translateX(-50%); width: min(820px, calc(100% - 16px)); max-height: calc(100% - var(--top-h, 48px) - 24px); overflow: auto; padding: 10px 14px; display: flex; flex-direction: column; gap: 4px; }
    .msec { color: var(--accent); font-size: 12px; text-transform: uppercase; letter-spacing: .05em; margin: 10px 0 2px; border-bottom: 1px solid var(--line); padding-bottom: 2px; }
    .mblock { margin: 2px 0 4px; }
    .mhead { color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: .04em; }
    .mlist { margin: 0; padding-left: 18px; }
    .mlist li { margin: 1px 0; }
    .morning .main { padding: 6px 8px; border: 1px solid var(--line); border-radius: 4px; background: var(--panel-2); }
    .morning .hint { margin-top: 3px; }
    .mfoot { display: flex; align-items: center; gap: 8px; margin: 8px -14px -10px; padding: 6px 14px 10px; border-top: 1px solid var(--line); position: sticky; bottom: -10px; background: rgba(22, 30, 34, 0.98); }
    .stock .csec { color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: .04em; margin: 6px 0 0; }
    .cashp table.grid tbody tr { cursor: default; }
    .cashsum { display: flex; gap: 24px; margin: 0; }
    .cashsum dt { color: var(--muted); font-size: 11px; }
    .cashsum dd { margin: 0; font-size: 18px; font-weight: 600; text-align: left; }
    /* лаборатория (3г): строки партий и их испытаний; карта X–Rm */
    .labp table.grid tbody tr { cursor: default; }
    .labp tr.lot td { border-top: 1px solid var(--line); }
    .labp tr.test td { border-bottom: none; padding-top: 1px; padding-bottom: 1px; }
    .labp td.sub { padding-left: 22px; color: var(--muted); }
    .rush { color: var(--yellow); }
    .chartsum { font-size: 12px; }
    svg.chart { background: rgba(0,0,0,.18); border-radius: 4px; }
    svg.chart line { stroke-width: 1; }
    svg.chart .cl line { stroke: var(--accent); }
    svg.chart .lim line { stroke: #ff8a7a; stroke-dasharray: 5 4; }
    svg.chart .spec line { stroke: var(--muted); stroke-dasharray: 2 4; }
    svg.chart text { fill: var(--muted); font-size: 10px; }
    svg.chart .trace { fill: none; stroke: rgba(255,255,255,.35); stroke-width: 1; }
    svg.chart .pt { fill: var(--text); }
    svg.chart .pt.bad { fill: #ff8a7a; }
    /* расписание (3д) — большое окно во всю ширину под полосой: строки — комплектовка, помещения, линия; полосы — по времени */
    .gantt { position: absolute; left: 8px; right: 8px; top: calc(var(--top-h, 48px) + 8px); max-height: calc(100% - var(--top-h, 48px) - 24px); overflow: auto; padding: 8px 10px; display: flex; flex-direction: column; gap: 2px; }
    .gantt .phead .filters { margin-left: 12px; }
    .grow-row { display: flex; align-items: stretch; min-height: 30px; }
    .glabel { flex: 0 0 180px; padding: 7px 8px 0 0; color: var(--muted); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .gtrack { position: relative; flex: 1 1 auto; border-bottom: 1px solid rgba(255,255,255,.06); overflow: hidden; }
    .gaxis { min-height: 20px; }
    .gaxis .gtrack { border-bottom: 1px solid var(--line); }
    .gtick { position: absolute; top: 0; bottom: 0; border-left: 1px solid rgba(255,255,255,.08); }
    .gtick.day { border-left-color: rgba(255,255,255,.3); }
    .gtick span { position: absolute; left: 3px; top: 3px; font-size: 10px; color: var(--muted); white-space: nowrap; }
    .gday { position: absolute; top: 0; bottom: 0; border-left: 1px solid rgba(255,255,255,.18); }
    .goff { position: absolute; top: 0; bottom: 0; background: rgba(0,0,0,.24); }
    .gnow { position: absolute; top: 0; bottom: 0; width: 2px; margin-left: -1px; background: var(--yellow); pointer-events: none; }
    .gbar { --c: #2fb5c9; position: absolute; top: 4px; bottom: 4px; box-sizing: border-box; border-radius: 3px; padding: 0 4px; font-size: 11px; line-height: 20px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: #0b1a1e; background: var(--c); border: 1px solid var(--c); cursor: pointer; user-select: none; }
    .gbar.k-kit { --c: #d9b45a; }
    .gbar.k-clean { --c: #8fa7c4; top: 9px; bottom: 9px; line-height: 10px; font-size: 9px; }
    .gbar.k-roomClean { --c: #a9bfa0; top: 9px; bottom: 9px; line-height: 10px; font-size: 9px; }
    .gbar.k-setup { --c: #b89ad8; }
    .gbar.k-pack { --c: #6fc28a; }
    .gbar.k-visit { --c: #d8f8c0; }
    .gbar.w-past { opacity: .6; }
    .gbar.w-now { box-shadow: inset 3px 0 0 #fff; }
    .gbar.w-plan { background: color-mix(in srgb, var(--c) 32%, transparent); border-style: dashed; color: var(--text); }
    .gbar.material { background-image: repeating-linear-gradient(45deg, rgba(0,0,0,.3) 0 4px, transparent 4px 8px); }
    .gbar.repair { box-shadow: inset 0 -3px 0 var(--red); }
    .gbar.move { cursor: grab; }
    .gbar.move:active { cursor: grabbing; }
    .gbar:focus-visible { outline: 2px solid #fff; outline-offset: 1px; }
    .gbar.dim { opacity: .25; }
    .gbar.ghost { background: transparent; border: 2px dashed #fff; color: #fff; pointer-events: none; z-index: 2; }
    .gfoot { display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: center; margin-top: 6px; font-size: 12px; }
    .glegend { display: inline-flex; flex-wrap: wrap; gap: 6px; }
    .glegend .gbar { position: static; display: inline-block; padding: 0 6px; line-height: 18px; cursor: default; }
    .goff-key { display: inline-block; padding: 0 6px; line-height: 18px; background: rgba(0,0,0,.35); border-radius: 3px; color: var(--muted); }
    .gtip { position: fixed; z-index: 10; max-width: 380px; padding: 6px 10px; font-size: 12px; pointer-events: none; }
    /* черновик и прогон плана (часть 5): полосы черновика — в белой рамке, прежние — бледнее; итог — таблица по вариантам */
    .gbar.draft { border: 1px solid #fff; background: color-mix(in srgb, var(--c) 55%, transparent); }
    .gbar.was { opacity: .3; pointer-events: none; }
    .gdraft { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 8px; padding: 4px 0 6px; font-size: 12px; }
    .gplan { margin-top: 8px; padding-top: 6px; border-top: 1px solid var(--line); display: flex; flex-direction: column; gap: 4px; }
    .gplan .warn { color: var(--yellow); font-size: 12px; }
    table.gsum { font-size: 12px; }
    table.gsum th { cursor: default; }
    table.gsum tbody tr { cursor: default; }
    table.gsum tbody tr:hover { background: none; }
    table.gsum tr.sec td { color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: .04em; padding-top: 8px; border-bottom-color: var(--line); }
    .gnote { font-size: 12px; }
    .gsum .delta { color: var(--accent); }
    /* «Кем вы будете» (3е) — посередине поверх всего: пять плиток мест */
    .seats { position: absolute; left: 50%; top: calc(var(--top-h, 48px) + 16px); transform: translateX(-50%); width: min(1100px, calc(100% - 16px)); max-height: calc(100% - var(--top-h, 48px) - 32px); overflow: auto; padding: 12px 14px; display: flex; flex-direction: column; gap: 10px; z-index: 5; background: rgba(22, 30, 34, 0.97); box-shadow: 0 6px 30px rgba(0,0,0,.5); }
    .tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 8px; }
    .tile { display: flex; flex-direction: column; gap: 6px; align-items: stretch; text-align: left; padding: 10px; font-size: 12px; line-height: 1.35; white-space: normal; }
    .tile .tname { font-size: 15px; }
    .tile.on { background: rgba(47,181,201,.18); color: var(--text); border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
    .tile .tkey { color: var(--muted); }
    .tile .tnote { color: var(--yellow); }
    .tile:disabled { opacity: .6; }
    .tile:focus-visible { outline: 2px solid #fff; outline-offset: 1px; }
    .sfoot { display: flex; align-items: center; gap: 12px; }
    .sfoot .muted { margin-right: auto; }
    .seatbtn { max-width: 280px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    /* доска расследования (часть 4б) — большое окно во всю ширину под полосой, как расписание: три столбца и решение снизу */
    .inv { position: absolute; left: 8px; right: 8px; top: calc(var(--top-h, 48px) + 8px); max-height: calc(100% - var(--top-h, 48px) - 24px); overflow: auto; padding: 8px 12px 10px; display: flex; flex-direction: column; gap: 4px; background: rgba(22, 30, 34, 0.98); }
    .icols { display: grid; grid-template-columns: minmax(220px, 1fr) minmax(320px, 1.7fr) minmax(220px, 1fr); gap: 14px; }
    @media (max-width: 900px) { .icols { grid-template-columns: 1fr; } }
    .isec { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
    .isec .msec { margin-top: 6px; }
    .small { font-size: 11px; }
    ul.iplain { margin: 0 0 4px; padding-left: 16px; }
    ol.isteps { margin: 0; padding-left: 0; list-style: none; display: flex; flex-direction: column; gap: 6px; }
    ol.isteps > li { border: 1px solid var(--line); border-radius: 4px; padding: 4px 8px; background: var(--panel-2); }
    ol.isteps > li[data-state="done"] { background: transparent; }
    .ihead { display: flex; align-items: center; gap: 8px; }
    .ihead2 { font-size: 14px; margin: 2px 0; }
    ul.iobs { margin: 3px 0 0; padding-left: 0; list-style: none; }
    ul.iobs li { padding-left: 10px; border-left: 3px solid var(--line); margin: 2px 0; }
    ul.iobs li.yes { border-left-color: var(--yellow); }
    ul.ivers { margin: 2px 0 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 5px; }
    ul.ivers li { display: grid; grid-template-columns: minmax(90px, 1.3fr) 1fr 44px; gap: 6px; align-items: center; }
    .vbar { height: 10px; border-radius: 3px; background: rgba(255,255,255,.08); overflow: hidden; }
    .vbar > span { display: block; height: 100%; background: var(--accent); }
    .idecide .irow { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; }
    .idecide .label { min-width: 100px; margin-left: 0; }
    .idebrief { border-top: 1px solid var(--line); margin-top: 6px; padding-top: 2px; }
    /* «Сейчас» (Б1б): строки работ — что и кто, сколько прошло и по норме, «Смотреть» */
    .nowp { width: min(560px, calc(100% - 16px)); }
    .nsec .msec { margin-top: 4px; }
    ul.nlist { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 2px; }
    ul.nlist li { display: grid; grid-template-columns: 1fr auto auto auto; gap: 8px; align-items: center; padding: 2px 0; border-bottom: 1px solid rgba(255,255,255,.06); }
    ul.nlist li.on { background: rgba(47,181,201,.12); }
    button.nmain { display: flex; flex-direction: column; align-items: flex-start; gap: 1px; background: none; border: none; padding: 2px 4px; text-align: left; color: var(--text); cursor: pointer; min-width: 0; }
    button.nmain:hover .ntitle { text-decoration: underline; text-decoration-color: var(--accent); }
    button.nmain:disabled { cursor: default; }
    .ntitle { display: flex; align-items: center; gap: 5px; }
    .ntitle .sicon { flex: none; }
    .ntime { color: var(--muted); white-space: nowrap; font-variant-numeric: tabular-nums; }
    .cwatch { margin-top: 6px; }
    /* журнал решений (Б5а): справа, как «Сейчас»; строка — когда и кто, что решено, причина раскрывается */
    .journal { width: min(620px, calc(100% - 16px)); }
    ul.jlist { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 2px; }
    ul.jlist li.jrow { padding: 3px 0; border-bottom: 1px solid rgba(255,255,255,.06); }
    ul.jlist li.jrow.on { background: rgba(47,181,201,.08); }
    .jline { display: flex; align-items: baseline; gap: 8px; }
    .jline > button.link { flex: 1 1 auto; min-width: 0; text-decoration: none; }
    .jline > button.link:hover { text-decoration: underline; text-decoration-color: var(--accent); }
    .jline > button.small { flex: none; }
    ul.jwhy { margin: 2px 0 2px 14px; padding-left: 12px; font-size: 12px; color: var(--muted); border-left: 2px solid var(--accent); }
    ul.jwhy li { margin: 1px 0; list-style: none; }
    .who ul.whol { margin: 0; padding-left: 0; list-style: none; font-size: 12px; }
    .who ul.whol li { margin: 1px 0; }
    .who ul.whol button { font-size: 11px; padding: 0 5px; }
    .inv .iwhy { font-size: 12px; }
    /* «Смотрите: …» — текст сокращается, «Перестать» видна всегда */
    .watching { display: inline-flex; align-items: center; gap: 6px; min-width: 0; max-width: 45%; color: var(--accent); }
    .watching .wtext { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .watching button { flex: none; }
    /* что делать (Б1г): рычаги у строки — кнопка и что она изменит; пояснение при первом событии; решение по серии */
    .levers { margin: 3px 0 2px; display: flex; flex-direction: column; gap: 2px; font-size: 12px; }
    .lever button { font-size: 12px; padding: 1px 6px; }
    .first { margin: 2px 0 6px; padding: 6px 8px; border-left: 3px solid var(--accent); background: rgba(255, 255, 255, .05); font-size: 12px; }
    .first button { margin-top: 4px; }
    .card ul.checks { margin: 0; padding-left: 0; list-style: none; }
    .cbtns { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin: 4px 0 2px; }
    .cbtns .muted, .cbtns .warn { flex-basis: 100%; font-size: 12px; }
    .upick { position: relative; display: inline-flex; }
    .upick-list { position: absolute; top: calc(100% + 3px); left: 0; z-index: 6; display: flex; flex-direction: column; align-items: stretch; gap: 3px; padding: 6px; min-width: 220px; background: rgba(22, 30, 34, 0.98); border: 1px solid var(--line); border-radius: 4px; box-shadow: 0 2px 10px rgba(0,0,0,.35); }
    .upick-list button { text-align: left; }
    /* справочник завода (Б1а) — большое окно под полосой, как доска расследования: вкладки и таблицы «как должно быть и как есть» */
    .ref { position: absolute; left: 8px; right: 8px; top: calc(var(--top-h, 48px) + 8px); max-height: calc(100% - var(--top-h, 48px) - 24px); overflow: auto; padding: 8px 12px 10px; display: flex; flex-direction: column; gap: 4px; background: rgba(22, 30, 34, 0.98); }
    .ref .phead .filters { margin-left: 12px; }
    /* шапка большого окна — название и ✕ — всегда наверху, когда окно прокручено (0.0.37), как подвал планёрки */
    /* досье серии (Б1д): поверх остальных окон и карточки */
    .dossier { position: absolute; left: 50%; top: calc(var(--top-h, 48px) + 8px); transform: translateX(-50%); width: min(1100px, calc(100% - 16px)); max-height: calc(100% - var(--top-h, 48px) - 24px); overflow: auto; padding: 8px 12px 10px; display: flex; flex-direction: column; gap: 6px; z-index: 7; background: rgba(22, 30, 34, 0.98); box-shadow: 0 6px 30px rgba(0,0,0,.5); }
    .dossier > .phead { position: sticky; top: -8px; z-index: 1; margin: -8px -12px 0; padding: 8px 12px 4px; background: rgba(22, 30, 34, 0.98); border-bottom: 1px solid var(--line); }
    .dossier .dhead { display: grid; grid-template-columns: max-content 1fr; gap: 2px 12px; margin: 4px 0; }
    .dossier .dhead dt { color: var(--muted); }
    .dossier .dhead dd { margin: 0; }
    .dossier .dsec { display: flex; flex-direction: column; gap: 3px; }
    .dossier .dtab { border-collapse: collapse; width: 100%; font-size: 12px; }
    .dossier .dtab th { text-align: left; color: var(--muted); font-weight: normal; border-bottom: 1px solid var(--line); padding: 2px 6px; }
    .dossier .dtab td { padding: 2px 6px; vertical-align: top; }
    .dossier .dtab .num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
    .dossier .dstages { margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 6px; }
    .dossier .dstage.s-plan { opacity: 0.75; }
    .inv > .phead, .ref > .phead, .kpi > .phead { position: sticky; top: -8px; z-index: 1; margin: -8px -12px 0; padding: 8px 12px 4px; background: rgba(22, 30, 34, 0.98); border-bottom: 1px solid var(--line); }
    /* окно «Показатели» (Б5ж) — большое, как справочник: строка руководителя и плитки его показателей; столбики 12 месяцев
       приглушены, последний закрытый — акцентом: с ним сравнивают число месяца; «лучше» и «хуже» — стрелкой, словом и цветом */
    .kpi { position: absolute; left: 8px; right: 8px; top: calc(var(--top-h, 48px) + 8px); max-height: calc(100% - var(--top-h, 48px) - 24px); overflow: auto; padding: 8px 12px 10px; display: flex; flex-direction: column; gap: 2px; background: rgba(22, 30, 34, 0.98); }
    .kpi .phead .filters { margin-left: 12px; }
    .kpi .kmonth { margin-left: 12px; font-size: 12px; }
    .kpi .khead { display: grid; grid-template-columns: 180px 1fr; gap: 6px 10px; padding: 8px 0; border-bottom: 1px solid rgba(255,255,255,.06); }
    .kpi .khname { font-weight: 600; padding-top: 4px; }
    .kpi .kcells { display: flex; flex-wrap: wrap; gap: 8px; }
    .kpi .kcell { width: 200px; box-sizing: border-box; padding: 6px 8px; border-radius: 4px; background: rgba(255,255,255,.04); display: flex; flex-direction: column; gap: 2px; }
    .kpi .kcell.on { box-shadow: inset 0 0 0 1px var(--accent); }
    .kpi .kname { font-size: 12px; color: var(--muted); cursor: help; }
    .kpi .kline { display: flex; align-items: flex-end; justify-content: space-between; gap: 6px; min-height: 28px; }
    .kpi .kvalue { font-size: 18px; font-weight: 600; white-space: nowrap; }
    .kpi .kspark { flex: none; }
    .kpi .kspark rect { fill: #62747b; }
    .kpi .kspark rect.klast { fill: var(--accent); }
    .kpi .kspark rect:hover { fill: #a9bcc2; }
    .kpi .kspark .kbase { stroke: rgba(255,255,255,.14); stroke-width: 1; }
    .kpi .ksub { font-size: 11px; }
    .kpi .kwhy { font-size: 12px; align-self: flex-start; }
    .kpi .kwhylist { grid-column: 2; padding: 6px 10px; border-left: 2px solid var(--accent); background: rgba(255,255,255,.03); }
    .kpi .kwhylist .mlist { margin: 4px 0 0; }
    .good { color: #7fd69a; }
    @media (max-width: 720px) { .kpi .khead { grid-template-columns: 1fr; } .kpi .kwhylist { grid-column: 1; } }
    /* ограда панели (src/ui/Guard.tsx): на месте упавшей панели — ошибка и «Закрыть» */
    .guard { position: absolute; left: 50%; top: calc(var(--top-h, 48px) + 8px); transform: translateX(-50%); max-width: min(720px, calc(100% - 16px)); z-index: 6; display: flex; align-items: center; gap: 10px; padding: 8px 12px; }
    .rbody { display: flex; flex-direction: column; gap: 6px; }
    .rsec { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
    .rsub { margin: 4px 0 2px 10px; }
    /* производственный календарь в справочнике (Б4а): праздник — жирным, короткий день — подчёркнут, выходной — бледнее */
    .cal { display: grid; grid-template-columns: repeat(7, 28px); gap: 2px; font-size: 11px; }
    .cal span { text-align: center; padding: 2px 0; border-radius: 3px; }
    .cal .wd, .cal .off { color: var(--muted); }
    .cal .work, .cal .short { background: rgba(255,255,255,.06); }
    .cal .short { text-decoration: underline dotted; }
    .cal .holiday { color: #ff8a7a; font-weight: 700; }
    .scal { display: grid; gap: 1px; font-size: 10px; overflow-x: auto; }
    .scal span { text-align: center; padding: 1px 0; border-radius: 2px; white-space: nowrap; }
    .scal .sname { text-align: left; padding-right: 6px; }
    .scal .wd, .scal .off { color: var(--muted); }
    .scal .day { background: rgba(255,255,255,.08); }
    .scal .night { background: rgba(120,140,255,.18); }
    .scal .extra { background: rgba(255,138,122,.22); color: #ff8a7a; }
    .calkey { margin-right: 10px; }
    .calkey.holiday { color: #ff8a7a; font-weight: 700; }
    .calkey.short { text-decoration: underline dotted; }
    button.link { background: none; border: none; padding: 0; color: inherit; text-decoration: underline dotted; cursor: pointer; font: inherit; text-align: left; }
    table.rtable { border-collapse: collapse; width: 100%; font-size: 12px; margin: 2px 0 4px; }
    table.rtable th { text-align: left; color: var(--muted); font-weight: 500; padding: 3px 6px; border-bottom: 1px solid var(--line); vertical-align: bottom; }
    table.rtable td { padding: 3px 6px; border-bottom: 1px solid rgba(255,255,255,.06); vertical-align: top; }
    .nw { white-space: nowrap; }
    /* порядок и поиск в таблицах справочника (Б1в) */
    .ref .rsearch { margin-left: 12px; width: 180px; padding: 3px 6px; background: rgba(0,0,0,.25); color: var(--text); border: 1px solid var(--line); border-radius: 4px; font: inherit; font-size: 12px; }
    .ref .rsearch:focus-visible { outline: 2px solid var(--accent); outline-offset: 0; }
    button.sortbtn { background: none; border: none; padding: 0; color: inherit; font: inherit; text-align: left; cursor: pointer; }
    button.sortbtn.on { color: var(--text); }
    button.sortbtn:hover { text-decoration: underline; text-decoration-color: var(--accent); }
    button.sortbtn:focus-visible { outline: 2px solid #fff; outline-offset: 1px; }
    .badge { color: var(--yellow); font-weight: 600; }
    button.notice.link { background: none; border: none; padding: 0; color: var(--yellow); cursor: pointer; }
    .top .notice.stop { color: var(--text); font-weight: 600; }
    button.notice.link.stop { color: var(--yellow); }
    .pauses { position: absolute; left: 8px; top: calc(var(--top-h, 48px) + 8px); padding: 8px 12px; display: flex; flex-direction: column; gap: 4px; max-width: calc(100% - 16px); z-index: 4; }
    .pauses ul { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 3px; }
    .pauses li.muted label { color: var(--muted); }
    button.notice.link:hover { text-decoration: underline; text-decoration-color: var(--accent); }
    /* график отпусков (Б4г): недели года — пусто, часть черновика — контур, утверждённая — заливка, с помехой — штриховка */
    table.leaveplan td.weeks { white-space: nowrap; }
    table.leaveplan .wk { display: inline-block; width: 6px; height: 12px; margin-right: 1px; background: rgba(255,255,255,.06); vertical-align: middle; }
    table.leaveplan .wk.on { background: var(--accent); }
    table.leaveplan .wk.draft { background: transparent; box-shadow: inset 0 0 0 1px var(--accent); }
    table.leaveplan .wk.bad { background: repeating-linear-gradient(45deg, #ff8a7a 0 2px, transparent 2px 4px); }
    table.leaveplan tbody tr { cursor: pointer; }
    table.leaveplan tr.on td { background: rgba(47,181,201,.12); }
    .also { margin-right: 10px; }
  </style>
</head>
