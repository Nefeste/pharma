<!doctype html>
<html lang="ru">
<head>

  <title>Farmzavod</title>
  <!-- из bolnitsa: app/index.html @ e0a3491 — изменено: полоса сверху, отладка и состояние (часть 0); карточка вещи — её стиль `.card`, панель склада — своя (3б); планёрка и касса — свои (3в); лаборатория (3г), расписание (3д), «Кем вы будете» (3е), прогон плана (часть 5) и доска расследования (4б) — свои; ограда панели и шапка большого окна на виду (0.0.37), рычаги, пояснение при первом событии и решение по серии (Б1г) — свои -->
  <style>
    /* шрифт игры — IBM Plex Sans (марка «Больницы», решение владельца #8; SIL OFL 1.1, assets/fonts/OFL.txt): свои файлы,
       сети не нужно; переменные — насыщенность 100–700 и ширина 75–100 % в одном файле */
    @font-face { font-family: "IBM Plex Sans"; src: url("assets/fonts/IBMPlexSans[wdth,wght].ttf") format("truetype"); font-weight: 100 700; font-stretch: 75% 100%; font-style: normal; font-display: block; }
    @font-face { font-family: "IBM Plex Sans"; src: url("assets/fonts/IBMPlexSans-Italic[wdth,wght].ttf") format("truetype"); font-weight: 100 700; font-stretch: 75% 100%; font-style: italic; font-display: block; }
    /* из bolnitsa: app/index.html @ 15a7ad6 — токены окна (Б11, шаг 2), изменено: только те, что нужны заводу, и свои —
       полосы расписания, «заморожено», ночь, шкала отступов. Все цвета, размеры шрифта, отступы, скругления и тени окна —
       здесь; правило берёт только их (tools/test/style.test.ts). --top-h ставит окно по высоте верхней полосы */
    :root {
      /* поверхности: стекло над картой, окна поверх карты, кнопки, подложки строк */
      --bg: #2a3236;
      --glass: rgba(22, 30, 34, 0.86);
      --glass-tag: rgba(22, 30, 34, 0.84);
      --window: rgba(22, 30, 34, 0.98);
      --window-2: rgb(28, 38, 43);
      --raised: rgba(36, 48, 54, 0.92);
      --raised-hover: rgba(52, 68, 76, 0.96);
      --sunken: rgba(0, 0, 0, 0.2);
      --shade: rgba(0, 0, 0, 0.3);
      --ring: rgba(0, 0, 0, 0.35);
      --wash: rgba(255, 255, 255, 0.05);
      --wash-2: rgba(255, 255, 255, 0.1);
      --line: rgba(255, 255, 255, 0.14);
      --line-strong: rgba(255, 255, 255, 0.18);
      --line-bright: rgba(255, 255, 255, 0.35);
      --shadow: 0 2px 10px rgba(0, 0, 0, 0.25);
      --shadow-strong: 0 2px 10px rgba(0, 0, 0, 0.35);
      --shadow-over: 0 6px 30px rgba(0, 0, 0, 0.5);
      /* текст */
      --text: #e9eef0;
      --muted: #a6b6bc;
      --strong: #ffffff;
      --on-accent: #0b1a1e;
      /* акцент — выбор, действие, «сейчас» */
      --accent: #2fb5c9;
      --accent-hover: #4cc6d8;
      --accent-wash-1: rgba(47, 181, 201, 0.08);
      --accent-wash-2: rgba(47, 181, 201, 0.14);
      --accent-wash-3: rgba(47, 181, 201, 0.22);
      /* состояние: зелёный — в норме, жёлтый — внимание, красный — плохо, серый — не работает */
      --ok: #4caf6e;
      --warn: #e7b416;
      --bad: #d8392b;
      --off: #6f7a80;
      --ok-text: #8fe3b4;
      --bad-text: #ff9b86;
      --bad-text-2: #ffc2b5;
      --bad-wash: rgba(216, 57, 43, 0.16);
      --bad-wash-2: rgba(216, 57, 43, 0.26);
      /* «заморожено» и сведения; ночные часы табеля */
      --info-text: #8fd3ff;
      --info-line: rgba(120, 190, 255, 0.8);
      --info-line-soft: rgba(120, 190, 255, 0.55);
      --info-wash: rgba(120, 190, 255, 0.08);
      --night-wash: rgba(120, 140, 255, 0.18);
      /* полосы расписания по роду работы */
      --bar-kit: #d9b45a;
      --bar-clean: #8fa7c4;
      --bar-room: #a9bfa0;
      --bar-setup: #b89ad8;
      --bar-pack: #6fc28a;
      --bar-visit: #d8f8c0;
      /* шрифт: плотные сетки, подпись, мелкий, текст, заголовок панели, заголовок окна, число итога, имя игры */
      --fs-tiny: 10px;
      --fs-caption: 11px;
      --fs-small: 12px;
      --fs-body: 13px;
      --fs-title: 16px;
      --fs-window: 18px;
      --fs-figure: 22px;
      --fs-display: 28px;
      /* отступы — ступени по 2 точки до 12, затем 16 и 24 */
      --sp-1: 2px;
      --sp-2: 4px;
      --sp-3: 6px;
      --sp-4: 8px;
      --sp-5: 10px;
      --sp-6: 12px;
      --sp-7: 16px;
      --sp-8: 24px;
      /* скругления */
      --r-s: 3px;
      --r-m: 4px;
      --r-l: 6px;
    }
    html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font: var(--fs-body)/1.35 "IBM Plex Sans", system-ui, "Segoe UI", Roboto, sans-serif; font-variant-numeric: tabular-nums; overflow: hidden; }
    #view { position: absolute; inset: 0; touch-action: none; }
    #ui { position: absolute; inset: 0; pointer-events: none; }
    #ui > * { pointer-events: auto; }
    .panel { background: var(--glass); border: 1px solid var(--line); border-radius: var(--r-l); box-shadow: var(--shadow); }
    button { font: inherit; color: var(--text); background: var(--raised); border: 1px solid var(--line); border-radius: var(--r-m); padding: var(--sp-2) var(--sp-5); cursor: pointer; }
    /* отклик кнопок (как у «Больницы»): наведение — светлее и рамка акцента, нажатие — на точку вниз, фокус виден */
    button { transition: border-color .12s, background-color .12s, transform .06s; }
    button:hover:not(:disabled) { border-color: var(--accent); background: var(--raised-hover); }
    button:active:not(:disabled) { transform: translateY(1px); }
    button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
    button.on:hover:not(:disabled) { background: var(--accent-hover); }
    /* поля ввода — одни во всех окнах */
    input[type=number], input[type=text], input[type=search], input[type=date], select, textarea { font: inherit; color: var(--text); background: var(--raised); border: 1px solid var(--line); border-radius: var(--r-m); padding: var(--sp-1) var(--sp-2); }
    input:focus-visible, select:focus-visible, textarea:focus-visible { outline: 2px solid var(--accent); outline-offset: 0; }
    button.on { background: var(--accent); color: var(--on-accent); border-color: var(--accent); }
    /* «меньше движения» (src/app/motion.ts): переходы и анимации страницы — мгновенны */
    :root[data-motion='less'] *, :root[data-motion='less'] *::before, :root[data-motion='less'] *::after { transition: none !important; animation: none !important; scroll-behavior: auto !important; }
    button:disabled { opacity: .45; cursor: default; }
    .top { position: absolute; left: 8px; right: 8px; top: 8px; display: flex; flex-wrap: wrap; align-items: center; gap: var(--sp-5); padding: var(--sp-3) var(--sp-5); }
    .top .clock { font-size: var(--fs-title); font-weight: 600; min-width: 52px; }
    .top .date { color: var(--muted); min-width: 150px; }
    .top .group, .debug .group { display: inline-flex; gap: var(--sp-2); align-items: center; }
    .top .stat b { color: var(--strong); }
    .top .warn { color: var(--warn); }
    .top .notice { flex: 1 1 0; min-width: 90px; text-align: right; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .label { color: var(--muted); margin: 0 var(--sp-1) 0 var(--sp-4); }
    .muted { color: var(--muted); }
    .debug { position: absolute; right: 8px; bottom: 10px; padding: var(--sp-4) var(--sp-5); display: flex; flex-direction: column; gap: var(--sp-3); max-width: 420px; }
    /* первый экран (Б11, шаг 2): имя игры, загрузка по настоящим шагам, версия — посреди окна */
    .boot { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: var(--sp-4); background: var(--bg); }
    .boot-name { font-size: var(--fs-display); font-weight: 600; letter-spacing: .02em; color: var(--strong); }
    .boot-tag { font-size: var(--fs-small); }
    .boot-bar { width: min(360px, 70%); height: 6px; margin-top: var(--sp-7); border-radius: var(--r-s); background: var(--wash-2); overflow: hidden; }
    .boot-bar i { display: block; height: 100%; background: var(--accent); transition: width .2s; }
    .boot-step, .boot-ver { font-size: var(--fs-caption); }
    .status { position: absolute; left: 50%; top: 45%; transform: translate(-50%, -50%); padding: var(--sp-6) var(--sp-7); font-size: var(--fs-title); max-width: 70%; text-align: center; }
    .mono { font-variant-numeric: tabular-nums; font-family: ui-monospace, "Cascadia Mono", Consolas, monospace; }
    .num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
    .nowrap { white-space: nowrap; }
    .sicon { vertical-align: -2px; }
    .close { margin-left: auto; }
    /* слои слева (Б1и; геймдизайн, §18): обычный вид, «Загрузка и OEE», «Потоки — люди»; окно и цвета частей словами */
    .layers { position: absolute; left: 8px; top: calc(var(--top-h, 48px) + 8px); width: 176px; padding: var(--sp-3) var(--sp-4); display: flex; flex-direction: column; gap: var(--sp-1); }
    /* общие классы окна (Б11, шаг 2): подзаголовок блока — мелкий серый прописными; у панелей своих нет */
    .lhead, .mhead, .csec { color: var(--muted); font-size: var(--fs-caption); text-transform: uppercase; letter-spacing: .04em; }
    /* стройка (Б7б): панель инструментов на месте слоёв, строки призрака и ответа, подписи помещений поверх вида */
    .layers.build { width: 236px; max-height: calc(100% - var(--top-h, 48px) - 24px); overflow-y: auto; }
    .layers.build .row { display: flex; flex-wrap: wrap; gap: var(--sp-2); align-items: center; }
    .layers.build .row button { padding: var(--sp-1) var(--sp-3); font-size: var(--fs-small); }
    .layers.build input[type=number] { width: 52px; }
    .layers.build .ghost { padding: var(--sp-2) var(--sp-3); border-left: 3px solid var(--ok); background: var(--raised); border-radius: var(--r-s); }
    .layers.build .ghost.warn { border-left-color: var(--warn); }
    .layers.build .ghost.bad { border-left-color: var(--bad); }
    .layers.build .keys { color: var(--muted); font-size: var(--fs-caption); }
    .labels { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
    .rlabel { position: absolute; left: 0; top: 0; padding: var(--sp-1) var(--sp-4); border-radius: var(--r-m); background: var(--glass-tag); border-left: 3px solid var(--ok); font-size: var(--fs-caption); line-height: 1.25; white-space: nowrap; color: var(--text); }
    .rlabel.bad { border-left-color: var(--bad); }
    .rlabel b { display: block; font-size: var(--fs-small); }
    .rlabel span { color: var(--muted); }
    .rlabel.bad span { color: var(--bad-text-2); }
    /* слои — плотным списком: со шкалой отступов кнопка выросла на две точки, и список доставал до карточки снизу */
    .layers > button { text-align: left; padding: var(--sp-1) var(--sp-4); }
    .lwin { display: inline-flex; flex-wrap: wrap; gap: var(--sp-1); margin: var(--sp-1) 0; }
    .lwin button { padding: 1px var(--sp-3); font-size: var(--fs-caption); }
    ul.legend, ul.loadrows, .floortip ul { list-style: none; margin: var(--sp-1) 0; padding: 0; }
    ul.legend li, ul.loadrows li, .floortip li { display: flex; align-items: center; gap: var(--sp-3); margin: 1px 0; }
    ul.legend { font-size: var(--fs-small); }
    .sw { flex: none; width: 10px; height: 10px; border-radius: var(--r-s); border: 1px solid var(--line-bright); }
    .floortip { position: fixed; z-index: 6; pointer-events: none; max-width: 340px; padding: var(--sp-3) var(--sp-5); font-size: var(--fs-small); }
    #ui > .floortip { pointer-events: none; }
    /* карточка вещи (3б) — снизу слева: справа — панель склада */
    .card { position: absolute; left: 8px; bottom: 10px; min-width: 380px; max-width: min(600px, calc(100% - 16px)); max-height: 46%; overflow: auto; padding: var(--sp-4) var(--sp-6); }
    /* склад открыт: карточка — слева от него, под панель не заходит */
    .card.beside { min-width: 0; max-width: min(600px, max(300px, calc(100% - min(760px, calc(100% - 16px)) - 24px))); }
    /* поверх большого окна (Б5ж) — непрозрачна, как досье: строки окна под ней не просвечивают */
    .card.over { z-index: 2; background: var(--window); box-shadow: var(--shadow-over); }
    .cardhead { display: flex; align-items: center; gap: var(--sp-4); margin-bottom: var(--sp-2); font-size: var(--fs-title); }
    .card dl { display: grid; grid-template-columns: 1fr 1fr; gap: var(--sp-1) var(--sp-7); margin: 0; }
    .card dt { color: var(--muted); font-size: var(--fs-caption); }
    .card dd { margin: 0 0 var(--sp-2); }
    .card .csec { margin: var(--sp-4) 0 var(--sp-1); }
    .card ul.why, .card ol.hist { margin: 0; padding-left: var(--sp-7); }
    .card ol.hist { list-style: none; padding-left: 0; }
    .card ol.hist li { margin: 1px 0; }
    /* табель месяца в карточке человека (Б4а): по дням недели — число, отметки формы Т-13, часы */
    .sheet { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: var(--sp-1); font-size: var(--fs-caption); margin: var(--sp-1) 0 var(--sp-3); }
    .sheet .sd { padding: 1px var(--sp-2); border: 1px solid var(--wash-2); border-radius: var(--r-s); line-height: 1.3; min-width: 0; }
    .sheet .sd b { color: var(--muted); font-weight: 500; margin-right: var(--sp-2); }
    .sheet .sd .sh { display: block; }
    .sheet .sd.over { border-color: var(--warn); }
    .sheet .sd.rest { color: var(--muted); }
    /* панель склада (3б) — справа под полосой */
    .stock { position: absolute; right: 8px; top: calc(var(--top-h, 48px) + 8px); width: min(760px, calc(100% - 16px)); max-height: calc(100% - var(--top-h, 48px) - 72px); overflow: auto; padding: var(--sp-4) var(--sp-5); display: flex; flex-direction: column; gap: var(--sp-3); }
    .phead { display: flex; align-items: baseline; gap: var(--sp-5); font-size: var(--fs-title); }
    .phead .muted { font-size: var(--fs-small); }
    .filters { display: flex; flex-wrap: wrap; gap: var(--sp-2); }
    table.grid { border-collapse: collapse; width: 100%; }
    table.grid th { text-align: left; color: var(--muted); font-weight: 500; padding: var(--sp-2) var(--sp-3); border-bottom: 1px solid var(--line); cursor: pointer; white-space: nowrap; }
    table.grid th.sorted { color: var(--text); }
    table.grid td { padding: var(--sp-2) var(--sp-3); border-bottom: 1px solid var(--wash); }
    table.grid tbody tr { cursor: pointer; }
    table.grid tbody tr:hover { background: var(--accent-wash-2); }
    .pager { display: flex; align-items: center; gap: var(--sp-4); justify-content: flex-end; }
    .pager .muted { margin-right: auto; }
    .empty { padding: var(--sp-3); }
    /* планёрка (3в) — большое окно сверху посередине; касса — справа, как склад */
    .bad { color: var(--bad-text); }
    .warn { color: var(--warn); }
    .grow { flex: 1 1 auto; }
    .go { cursor: pointer; }
    .go:hover { color: var(--strong); text-decoration: underline; text-decoration-color: var(--accent); }
    .morning { position: absolute; left: 50%; top: calc(var(--top-h, 48px) + 8px); transform: translateX(-50%); width: min(820px, calc(100% - 16px)); max-height: calc(100% - var(--top-h, 48px) - 24px); overflow: auto; padding: var(--sp-5) var(--sp-7); display: flex; flex-direction: column; gap: var(--sp-2); }
    .msec { color: var(--accent); font-size: var(--fs-small); text-transform: uppercase; letter-spacing: .05em; margin: var(--sp-5) 0 var(--sp-1); border-bottom: 1px solid var(--line); padding-bottom: var(--sp-1); }
    .mblock { margin: var(--sp-1) 0 var(--sp-2); }
    .mlist { margin: 0; padding-left: var(--sp-7); }
    .mlist li { margin: 1px 0; }
    .morning .main { padding: var(--sp-3) var(--sp-4); border: 1px solid var(--line); border-radius: var(--r-m); background: var(--raised); }
    .morning .hint { margin-top: var(--sp-2); }
    .mfoot { display: flex; align-items: center; gap: var(--sp-4); margin: var(--sp-4) calc(-1 * var(--sp-7)) calc(-1 * var(--sp-5)); padding: var(--sp-3) var(--sp-7) var(--sp-5); border-top: 1px solid var(--line); position: sticky; bottom: -10px; background: var(--window); }
    .stock .csec { margin: var(--sp-3) 0 0; }
    .cashp table.grid tbody tr { cursor: default; }
    .cashsum { display: flex; gap: var(--sp-8); margin: 0; }
    .cashsum dt { color: var(--muted); font-size: var(--fs-caption); }
    .cashsum dd { margin: 0; font-size: var(--fs-figure); font-weight: 600; text-align: left; }
    /* лаборатория (3г): строки партий и их испытаний; карта X–Rm */
    .labp table.grid tbody tr { cursor: default; }
    .labp tr.lot td { border-top: 1px solid var(--line); }
    .labp tr.test td { border-bottom: none; padding-top: 1px; padding-bottom: 1px; }
    .labp td.sub { padding-left: var(--sp-8); color: var(--muted); }
    .rush { color: var(--warn); }
    .chartsum { font-size: var(--fs-small); }
    svg.chart { background: var(--sunken); border-radius: var(--r-m); }
    svg.chart line { stroke-width: 1; }
    svg.chart .cl line { stroke: var(--accent); }
    svg.chart .lim line { stroke: var(--bad-text); stroke-dasharray: 5 4; }
    svg.chart .spec line { stroke: var(--muted); stroke-dasharray: 2 4; }
    svg.chart text { fill: var(--muted); font-size: var(--fs-tiny); }
    svg.chart .trace { fill: none; stroke: var(--line-bright); stroke-width: 1; }
    svg.chart .pt { fill: var(--text); }
    svg.chart .pt.bad { fill: var(--bad-text); }
    /* расписание (3д) — большое окно во всю ширину под полосой: строки — комплектовка, помещения, линия; полосы — по времени */
    .gantt { position: absolute; left: 8px; right: 8px; top: calc(var(--top-h, 48px) + 8px); max-height: calc(100% - var(--top-h, 48px) - 24px); overflow: auto; padding: var(--sp-4) var(--sp-5); display: flex; flex-direction: column; gap: var(--sp-1); }
    .gantt .phead .filters { margin-left: var(--sp-6); }
    /* вкладка «Задания» расписания (Б6а): строки заданий без щелчка по строке — номер ведёт к досье; заказы без покрытия */
    .jobs { display: flex; flex-direction: column; gap: var(--sp-3); padding-top: var(--sp-2); }
    .jobs table.grid tbody tr { cursor: default; }
    /* номер, сроки, выпуск, опоздание и кнопки — в строку; позиция, «под что» и состояние переносятся */
    .jobs table.grid td:nth-child(1), .jobs table.grid td:nth-child(4), .jobs table.grid td:nth-child(5), .jobs table.grid td:nth-child(7), .jobs table.grid td:nth-child(8), .jobs table.grid td:nth-child(9) { white-space: nowrap; }
    .jobs ul.plain { margin: 0; padding-left: var(--sp-7); }
    .jobs ul.plain li { margin: var(--sp-1) 0; }
    /* вкладка «План запуска» (Б6б): дни — столбцы, позиции — строки; задания — сплошные, правило — пунктир; нерабочие дни —
       серые; выбранная клетка — в рамке, под сеткой — что в ней */
    .launch { display: flex; flex-direction: column; gap: var(--sp-3); padding-top: var(--sp-2); }
    .launch-scroll { overflow-x: auto; }
    /* дни — равные узкие столбцы, 31 сутки помещаются в окно; позиция — слева и на месте при прокрутке */
    .launch table.grid { border-collapse: collapse; table-layout: fixed; width: max-content; }
    .launch table.grid th, .launch table.grid td { padding: var(--sp-1) 1px; text-align: center; width: 31px; min-width: 31px; max-width: 31px; overflow: hidden; cursor: default; }
    .launch table.grid th:first-child { width: 240px; min-width: 240px; max-width: 240px; text-align: left; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; position: sticky; left: 0; z-index: 1; background: var(--window-2); color: var(--text); font-weight: 400; }
    .launch table.grid thead th { font-size: var(--fs-tiny); line-height: 1.2; }
    .launch .off { background: var(--wash); color: var(--muted); }
    .launch td.sel { outline: 1px solid var(--accent); outline-offset: -1px; }
    .lchip { display: block; width: 100%; margin: 1px 0; padding: 1px 0; font-size: var(--fs-tiny); white-space: nowrap; overflow: hidden; text-overflow: clip; border-color: var(--accent); }
    .lchip.rule { border-style: dashed; border-color: var(--muted); color: var(--muted); background: transparent; }
    .lchip.drop { text-decoration: line-through; color: var(--muted); }
    .lchip.moved { border-color: var(--strong); }
    .lchip.visit { border-color: var(--warn); }
    .lchip.visit.rule { border-color: var(--warn); color: var(--warn); }
    .launch-pick { min-height: 22px; }
    .launch-pick ul { margin: 0; padding-left: 0; list-style: none; }
    /* вкладка «Прогноз» (Б6в): над сеткой — способ, спрос и ошибка; месяцы — столбцы, позиции — строки; в клетке — прогноз
       планирования, под ним мельче — отдела продаж; правка — пометка; ниже — «прогноз против факта» и ошибка способов */
    .fc { display: flex; flex-direction: column; gap: var(--sp-3); padding-top: var(--sp-2); }
    .fc-head { display: flex; flex-wrap: wrap; gap: var(--sp-3) var(--sp-7); align-items: center; }
    .fc-head .filters { display: inline-flex; flex-wrap: wrap; gap: var(--sp-2); align-items: center; margin-left: 0; }
    .fc-scroll { overflow-x: auto; }
    .fc table.fc-grid { border-collapse: collapse; table-layout: fixed; width: max-content; }
    .fc table.fc-grid th, .fc table.fc-grid td { padding: var(--sp-1) var(--sp-2); text-align: right; width: 52px; min-width: 52px; max-width: 52px; overflow: hidden; white-space: nowrap; }
    .fc table.fc-grid td { cursor: pointer; line-height: 1.15; }
    .fc table.fc-grid td small { font-size: var(--fs-tiny); }
    .fc table.fc-grid th:first-child { width: 240px; min-width: 240px; max-width: 240px; text-align: left; text-overflow: ellipsis; position: sticky; left: 0; z-index: 1; background: var(--window-2); color: var(--text); font-weight: 400; }
    .fc table.fc-grid thead th { font-size: var(--fs-tiny); text-align: right; }
    .fc table.fc-grid td.edit { background: var(--accent-wash-2); }
    .fc table.fc-grid td.sel { outline: 1px solid var(--accent); outline-offset: -1px; }
    .fc-mark { color: var(--accent); margin-left: var(--sp-1); font-size: var(--fs-tiny); }
    /* вкладка «Материалы» расписания (Б6д): сетка как у прогноза — материал слева, 12 месяцев; плановые заказы и заказы в пути */
    .mrp { display: flex; flex-direction: column; gap: var(--sp-3); }
    .mrp table.mrp-grid { border-collapse: collapse; table-layout: fixed; width: max-content; }
    .mrp table.mrp-grid th, .mrp table.mrp-grid td { padding: var(--sp-1) var(--sp-2); text-align: right; width: 64px; min-width: 64px; max-width: 64px; overflow: hidden; white-space: nowrap; line-height: 1.15; }
    .mrp table.mrp-grid td small { font-size: var(--fs-tiny); }
    .mrp table.mrp-grid th:first-child { width: 240px; min-width: 240px; max-width: 240px; text-align: left; text-overflow: ellipsis; position: sticky; left: 0; z-index: 1; background: var(--window-2); color: var(--text); font-weight: 400; }
    .mrp table.mrp-grid thead th { font-size: var(--fs-tiny); text-align: right; }
    .mrp table.mrp-grid tr.mrp-kind th { color: var(--muted); font-size: var(--fs-caption); text-transform: none; padding-top: var(--sp-3); }
    .mrp table.mrp-grid td.bad { background: var(--bad-wash); }
    .mrp-part { display: flex; flex-direction: column; gap: var(--sp-2); }
    .mrp-sup { display: block; }
    .mrp-sup .mlist { margin: var(--sp-1) 0 var(--sp-2) var(--sp-7); }
    .fc-pick { min-height: 26px; display: flex; flex-wrap: wrap; gap: var(--sp-3); align-items: center; }
    .fc-pick input { width: 80px; }
    .fc-chart-head { display: flex; flex-wrap: wrap; gap: var(--sp-4); align-items: center; margin-top: var(--sp-2); }
    .fc-chart-head .filters { margin-left: 0; display: inline-flex; flex-wrap: wrap; gap: var(--sp-2); }
    .fc-chart-row { display: flex; flex-wrap: wrap; gap: var(--sp-6); align-items: flex-start; }
    .fc-chart-box { flex: 1 1 520px; min-width: 320px; }
    .fc-legend { display: flex; flex-wrap: wrap; gap: var(--sp-2) var(--sp-7); font-size: var(--fs-caption); margin-top: var(--sp-1); }
    .fc-legend .sw { display: inline-block; vertical-align: middle; margin-right: var(--sp-2); }
    .fc-legend .sw.bar { width: 10px; height: 10px; border-radius: var(--r-s); }
    .fc-legend .sw.dot { width: 8px; height: 8px; border-radius: 50%; }
    .fc-legend .sw.sq { width: 8px; height: 8px; }
    svg.fc-chart .grid-y line { stroke: var(--wash-2); }
    svg.fc-chart .fc-now { stroke: var(--muted); stroke-dasharray: 2 3; }
    svg.fc-chart .fc-cross { stroke: var(--line-bright); }
    svg.fc-chart .fc-hit { fill: transparent; }
    svg.fc-chart .fc-tip { fill: var(--text); font-size: var(--fs-caption); }
    .fc-table { max-height: 220px; overflow-y: auto; }
    .fc table.fc-errs th, .fc table.fc-errs td { padding: var(--sp-1) var(--sp-3); white-space: nowrap; }
    .fc table.fc-errs td { text-align: right; }
    /* сменно-суточные задания (Б6б): строки задания у отдела планёрки и в карточке */
    .daily-rows { margin: var(--sp-1) 0 var(--sp-2); padding-left: var(--sp-7); font-size: var(--fs-small); }
    .grow-row { display: flex; align-items: stretch; min-height: 30px; }
    .glabel { flex: 0 0 180px; padding: var(--sp-4) var(--sp-4) 0 0; color: var(--muted); font-size: var(--fs-small); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .gtrack { position: relative; flex: 1 1 auto; border-bottom: 1px solid var(--wash); overflow: hidden; }
    .gaxis { min-height: 32px; }
    .gaxis .gtrack { border-bottom: 1px solid var(--line); }
    .gtick { position: absolute; top: 0; bottom: 0; border-left: 1px solid var(--wash-2); }
    .gtick.day { border-left-color: var(--line-bright); }
    .gtick span { position: absolute; left: 3px; top: 3px; font-size: var(--fs-tiny); color: var(--muted); white-space: nowrap; }
    .gday { position: absolute; top: 0; bottom: 0; border-left: 1px solid var(--line-strong); }
    .goff { position: absolute; top: 0; bottom: 0; background: var(--shade); }
    /* замороженный горизонт (Б6е): от сейчас до края — штриховка; на оси — край с подписью; цена правки в черновике */
    .gfrozen { position: absolute; top: 0; bottom: 0; pointer-events: none; border-right: 2px dashed var(--info-line-soft); background: repeating-linear-gradient(135deg, var(--info-wash) 0 6px, transparent 6px 12px); }
    .gfrozen-tick { position: absolute; top: 0; bottom: 0; border-left: 2px dashed var(--info-line); }
    .gfrozen-tick span { position: absolute; left: 4px; top: 17px; font-size: var(--fs-tiny); color: var(--info-text); white-space: nowrap; }
    .gfrozen-tick.end span { left: auto; right: 4px; }
    .gprice { color: var(--warn); }
    .launch-grid .frozen { background-image: repeating-linear-gradient(135deg, var(--info-wash) 0 6px, transparent 6px 12px); }
    .launch-grid th.edge, .launch-grid td.edge { border-left: 2px dashed var(--info-line); }
    .gnow { position: absolute; top: 0; bottom: 0; width: 2px; margin-left: -1px; background: var(--warn); pointer-events: none; }
    .gbar { --c: var(--accent); position: absolute; top: 4px; bottom: 4px; box-sizing: border-box; border-radius: var(--r-s); padding: 0 var(--sp-2); font-size: var(--fs-caption); line-height: 20px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--on-accent); background: var(--c); border: 1px solid var(--c); cursor: pointer; user-select: none; }
    .gbar.k-kit { --c: var(--bar-kit); }
    .gbar.k-clean { --c: var(--bar-clean); top: 9px; bottom: 9px; line-height: 10px; font-size: var(--fs-tiny); }
    .gbar.k-roomClean { --c: var(--bar-room); top: 9px; bottom: 9px; line-height: 10px; font-size: var(--fs-tiny); }
    .gbar.k-setup { --c: var(--bar-setup); }
    .gbar.k-pack { --c: var(--bar-pack); }
    .gbar.k-visit { --c: var(--bar-visit); }
    .gbar.w-past { opacity: .6; }
    .gbar.w-now { box-shadow: inset 3px 0 0 var(--strong); }
    .gbar.w-plan { background: color-mix(in srgb, var(--c) 32%, transparent); border-style: dashed; color: var(--text); }
    .gbar.material { background-image: repeating-linear-gradient(45deg, var(--shade) 0 4px, transparent 4px 8px); }
    .gbar.repair { box-shadow: inset 0 -3px 0 var(--bad); }
    .gbar.move { cursor: grab; }
    .gbar.move:active { cursor: grabbing; }
    .gbar:focus-visible { outline: 2px solid var(--strong); outline-offset: 1px; }
    .gbar.dim { opacity: .25; }
    .gbar.ghost { background: transparent; border: 2px dashed var(--strong); color: var(--strong); pointer-events: none; z-index: 2; }
    .gfoot { display: flex; flex-wrap: wrap; gap: var(--sp-3) var(--sp-7); align-items: center; margin-top: var(--sp-3); font-size: var(--fs-small); }
    .glegend { display: inline-flex; flex-wrap: wrap; gap: var(--sp-3); }
    .glegend .gbar { position: static; display: inline-block; padding: 0 var(--sp-3); line-height: 18px; cursor: default; }
    .goff-key { display: inline-block; padding: 0 var(--sp-3); line-height: 18px; background: var(--ring); border-radius: var(--r-s); color: var(--muted); }
    .gtip { position: fixed; z-index: 10; max-width: 380px; padding: var(--sp-3) var(--sp-5); font-size: var(--fs-small); pointer-events: none; }
    /* черновик и прогон плана (часть 5): полосы черновика — в белой рамке, прежние — бледнее; итог — таблица по вариантам */
    .gbar.draft { border: 1px solid var(--strong); background: color-mix(in srgb, var(--c) 55%, transparent); }
    .gbar.focus { outline: 2px solid var(--accent); outline-offset: 1px; z-index: 1; }
    .gbar.was { opacity: .3; pointer-events: none; }
    .gdraft { display: flex; flex-wrap: wrap; align-items: center; gap: var(--sp-3) var(--sp-4); padding: var(--sp-2) 0 var(--sp-3); font-size: var(--fs-small); }
    .gplan { margin-top: var(--sp-4); padding-top: var(--sp-3); border-top: 1px solid var(--line); display: flex; flex-direction: column; gap: var(--sp-2); }
    .gplan .warn { color: var(--warn); font-size: var(--fs-small); }
    table.gsum { font-size: var(--fs-small); }
    table.gsum th { cursor: default; }
    table.gsum tbody tr { cursor: default; }
    table.gsum tbody tr:hover { background: none; }
    table.gsum tr.sec td { color: var(--muted); font-size: var(--fs-caption); text-transform: uppercase; letter-spacing: .04em; padding-top: var(--sp-4); border-bottom-color: var(--line); }
    .gnote { font-size: var(--fs-small); }
    .gsum .delta { color: var(--accent); }
    /* «Кем вы будете» (3е) — посередине поверх всего: пять плиток мест */
    .seats { position: absolute; left: 50%; top: calc(var(--top-h, 48px) + 16px); transform: translateX(-50%); width: min(1100px, calc(100% - 16px)); max-height: calc(100% - var(--top-h, 48px) - 32px); overflow: auto; padding: var(--sp-6) var(--sp-7); display: flex; flex-direction: column; gap: var(--sp-5); z-index: 5; background: var(--window); box-shadow: var(--shadow-over); }
    .tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: var(--sp-4); }
    .tile { display: flex; flex-direction: column; gap: var(--sp-3); align-items: stretch; text-align: left; padding: var(--sp-5); font-size: var(--fs-small); line-height: 1.35; white-space: normal; }
    .tile .tname { font-size: var(--fs-title); }
    .tile.on { background: var(--accent-wash-3); color: var(--text); border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
    .tile .tkey { color: var(--muted); }
    .tile .tnote { color: var(--warn); }
    .tile:disabled { opacity: .6; }
    .tile:focus-visible { outline: 2px solid var(--strong); outline-offset: 1px; }
    .sfoot { display: flex; align-items: center; gap: var(--sp-6); }
    .sfoot .muted { margin-right: auto; }
    /* экран «Кампания» и окно целей сценария (Б9): карточки сценариев — как плитки мест; цели — справа под полосой */
    div.tile { background: var(--raised); border: 1px solid var(--line); border-radius: var(--r-m); }
    div.tile .take { margin-top: auto; align-self: flex-start; }
    .goals { position: absolute; right: 8px; top: calc(var(--top-h, 48px) + 8px); width: min(440px, calc(100% - 16px)); max-height: calc(100% - var(--top-h, 48px) - 24px); overflow: auto; padding: var(--sp-4) var(--sp-6) var(--sp-5); display: flex; flex-direction: column; gap: var(--sp-3); z-index: 5; background: var(--window); box-shadow: var(--shadow-over); }
    .goals ul { margin: 0; padding-left: var(--sp-7); }
    .goalbtn { white-space: nowrap; }
    .goals li.ok { color: var(--ok); }
    .goals .take { align-self: flex-start; }
    .letters { position: absolute; left: 8px; top: calc(var(--top-h, 48px) + 8px); width: min(520px, calc(100% - 16px)); max-height: calc(100% - var(--top-h, 48px) - 24px); overflow: auto; padding: var(--sp-4) var(--sp-6) var(--sp-5); display: flex; flex-direction: column; gap: var(--sp-3); z-index: 6; background: var(--window); box-shadow: var(--shadow-over); }
    .letters .lrows { list-style: none; margin: 0; padding: 0; max-height: 30vh; overflow: auto; }
    .letters .lrow { display: flex; flex-direction: column; align-items: flex-start; width: 100%; text-align: left; background: none; border: 0; border-left: 3px solid transparent; padding: var(--sp-2) var(--sp-3); color: inherit; }
    .letters .lrow.on { background: var(--raised); border-left-color: var(--accent); }
    .letters .lrow.new > span:first-child { font-weight: 600; }
    .letters .letter p { margin: var(--sp-2) 0; line-height: 1.4; }
    .letters .lacts { display: flex; gap: var(--sp-3); flex-wrap: wrap; }
    .chronicle { position: absolute; left: 8px; top: calc(var(--top-h, 48px) + 8px); width: min(620px, calc(100% - 16px)); max-height: calc(100% - var(--top-h, 48px) - 24px); overflow: auto; padding: var(--sp-4) var(--sp-6) var(--sp-5); display: flex; flex-direction: column; gap: var(--sp-3); z-index: 6; background: var(--window); box-shadow: var(--shadow-over); }
    .chronicle .tabs { display: flex; gap: var(--sp-2); }
    .chronicle .lacts { display: flex; gap: var(--sp-4); align-items: center; flex-wrap: wrap; }
    .chronicle .crows { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: var(--sp-2); }
    .chronicle .crows li { line-height: 1.4; }
    .chronicle .cyear { display: flex; flex-direction: column; gap: var(--sp-1); }
    .chronicle button.link, .morning button.link { background: none; border: 0; padding: 0; color: inherit; text-align: left; text-decoration: underline dotted; cursor: pointer; }
    .goalbtn.new { font-weight: 600; }
    .seatbtn { max-width: 280px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    /* доска расследования (часть 4б) — большое окно во всю ширину под полосой, как расписание: три столбца и решение снизу */
    .inv { position: absolute; left: 8px; right: 8px; top: calc(var(--top-h, 48px) + 8px); max-height: calc(100% - var(--top-h, 48px) - 24px); overflow: auto; padding: var(--sp-4) var(--sp-6) var(--sp-5); display: flex; flex-direction: column; gap: var(--sp-2); background: var(--window); }
    .icols { display: grid; grid-template-columns: minmax(220px, 1fr) minmax(320px, 1.7fr) minmax(220px, 1fr); gap: var(--sp-7); }
    @media (max-width: 900px) { .icols { grid-template-columns: 1fr; } }
    .isec { display: flex; flex-direction: column; gap: var(--sp-2); min-width: 0; }
    .isec .msec { margin-top: var(--sp-3); }
    .small { font-size: var(--fs-caption); }
    ul.iplain { margin: 0 0 var(--sp-2); padding-left: var(--sp-7); }
    ol.isteps { margin: 0; padding-left: 0; list-style: none; display: flex; flex-direction: column; gap: var(--sp-3); }
    ol.isteps > li { border: 1px solid var(--line); border-radius: var(--r-m); padding: var(--sp-2) var(--sp-4); background: var(--raised); }
    ol.isteps > li[data-state="done"] { background: transparent; }
    .ihead { display: flex; align-items: center; gap: var(--sp-4); }
    .ihead2 { font-size: var(--fs-body); margin: var(--sp-1) 0; }
    ul.iobs { margin: var(--sp-2) 0 0; padding-left: 0; list-style: none; }
    ul.iobs li { padding-left: var(--sp-5); border-left: 3px solid var(--line); margin: var(--sp-1) 0; }
    ul.iobs li.yes { border-left-color: var(--warn); }
    ul.ivers { margin: var(--sp-1) 0 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: var(--sp-3); }
    ul.ivers li { display: grid; grid-template-columns: minmax(90px, 1.3fr) 1fr 44px; gap: var(--sp-3); align-items: center; }
    .vbar { height: 10px; border-radius: var(--r-s); background: var(--wash-2); overflow: hidden; }
    .vbar > span { display: block; height: 100%; background: var(--accent); }
    .idecide .irow { display: flex; flex-wrap: wrap; gap: var(--sp-2); align-items: center; }
    .idecide .label { min-width: 100px; margin-left: 0; }
    .idebrief { border-top: 1px solid var(--line); margin-top: var(--sp-3); padding-top: var(--sp-1); }
    /* «Сейчас» (Б1б): строки работ — что и кто, сколько прошло и по норме, «Смотреть» */
    .nowp { width: min(560px, calc(100% - 16px)); }
    .nsec .msec { margin-top: var(--sp-2); }
    ul.nlist { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: var(--sp-1); }
    ul.nlist li { display: grid; grid-template-columns: 1fr auto auto auto; gap: var(--sp-4); align-items: center; padding: var(--sp-1) 0; border-bottom: 1px solid var(--wash); }
    ul.nlist li.on { background: var(--accent-wash-2); }
    button.nmain { display: flex; flex-direction: column; align-items: flex-start; gap: 1px; background: none; border: none; padding: var(--sp-1) var(--sp-2); text-align: left; color: var(--text); cursor: pointer; min-width: 0; }
    button.nmain:hover .ntitle { text-decoration: underline; text-decoration-color: var(--accent); }
    button.nmain:disabled { cursor: default; }
    .ntitle { display: flex; align-items: center; gap: var(--sp-3); }
    .ntitle .sicon { flex: none; }
    .ntime { color: var(--muted); white-space: nowrap; font-variant-numeric: tabular-nums; }
    .cwatch { margin-top: var(--sp-3); }
    /* журнал решений (Б5а): справа, как «Сейчас»; строка — когда и кто, что решено, причина раскрывается */
    .journal { width: min(620px, calc(100% - 16px)); }
    ul.jlist { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: var(--sp-1); }
    ul.jlist li.jrow { padding: var(--sp-2) 0; border-bottom: 1px solid var(--wash); }
    ul.jlist li.jrow.on { background: var(--accent-wash-1); }
    .jline { display: flex; align-items: baseline; gap: var(--sp-4); }
    .jline > button.link { flex: 1 1 auto; min-width: 0; text-decoration: none; }
    .jline > button.link:hover { text-decoration: underline; text-decoration-color: var(--accent); }
    .jline > button.small { flex: none; }
    ul.jwhy { margin: var(--sp-1) 0 var(--sp-1) var(--sp-7); padding-left: var(--sp-6); font-size: var(--fs-small); color: var(--muted); border-left: 2px solid var(--accent); }
    ul.jwhy li { margin: 1px 0; list-style: none; }
    .who ul.whol { margin: 0; padding-left: 0; list-style: none; font-size: var(--fs-small); }
    .who ul.whol li { margin: 1px 0; }
    .who ul.whol button { font-size: var(--fs-caption); padding: 0 var(--sp-3); }
    .inv .iwhy { font-size: var(--fs-small); }
    /* «Смотрите: …» — текст сокращается, «Перестать» видна всегда */
    .watching { display: inline-flex; align-items: center; gap: var(--sp-3); min-width: 0; max-width: 45%; color: var(--accent); }
    .watching .wtext { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .watching button { flex: none; }
    /* что делать (Б1г): рычаги у строки — кнопка и что она изменит; пояснение при первом событии; решение по серии */
    .levers { margin: var(--sp-2) 0 var(--sp-1); display: flex; flex-direction: column; gap: var(--sp-1); font-size: var(--fs-small); }
    .lever button { font-size: var(--fs-small); padding: 1px var(--sp-3); }
    .first { margin: var(--sp-1) 0 var(--sp-3); padding: var(--sp-3) var(--sp-4); border-left: 3px solid var(--accent); background: var(--wash); font-size: var(--fs-small); }

    .ref { position: absolute; left: 8px; right: 8px; top: calc(var(--top-h, 48px) + 8px); max-height: calc(100% - var(--top-h, 48px) - 24px); overflow: auto; padding: var(--sp-4) var(--sp-6) var(--sp-5); display: flex; flex-direction: column; gap: var(--sp-2); background: var(--window); }

    .jrow.asking { border-left: 3px solid var(--warn); padding-left: var(--sp-3); }
    .ask.ok { color: var(--ok-text); }

    .modes .filters { flex-wrap: wrap; }
    .dossier .dtab .num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }

    .inv > .phead, .ref > .phead, .kpi > .phead { position: sticky; top: -8px; z-index: 1; margin: calc(-1 * var(--sp-4)) calc(-1 * var(--sp-6)) 0; padding: var(--sp-4) var(--sp-6) var(--sp-2); background: var(--window); border-bottom: 1px solid var(--line); }
    /* окно «Показатели» (Б5ж) — большое, как справочник: строка руководителя и плитки его показателей; столбики 12 месяцев

    .kpi { position: absolute; left: 8px; right: 8px; top: calc(var(--top-h, 48px) + 8px); max-height: calc(100% - var(--top-h, 48px) - 24px); overflow: auto; padding: var(--sp-4) var(--sp-6) var(--sp-5); display: flex; flex-direction: column; gap: var(--sp-1); background: var(--window); }

    .pol .prow { display: grid; grid-template-columns: minmax(220px, 1.2fr) minmax(240px, 1.4fr) 2fr; gap: var(--sp-2) var(--sp-6); align-items: center; padding: var(--sp-3) 0 var(--sp-3) var(--sp-4); border-bottom: 1px solid var(--wash); border-left: 3px solid transparent; }

    .sop table.sopgrid th, .sop table.sopgrid td { padding: var(--sp-1) var(--sp-3); text-align: right; border-bottom: 1px solid var(--wash); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    .pol .pctl b { min-width: 3.5em; text-align: center; }
    .pol .pfoot { display: flex; align-items: center; gap: var(--sp-4); padding: var(--sp-4) 0 var(--sp-2); flex-wrap: wrap; }
    .pol .pfoot > .muted { margin-right: auto; }
    .pol .ptab { border-collapse: collapse; margin: var(--sp-2) 0; }
    .pol .ptab td, .pol .ptab th { padding: var(--sp-2) var(--sp-6) var(--sp-2) 0; text-align: left; font-variant-numeric: tabular-nums; }
    .pol .ptab th { color: var(--muted); font-weight: 400; }
    .kpi .khead { display: grid; grid-template-columns: 180px 1fr; gap: var(--sp-3) var(--sp-5); padding: var(--sp-4) 0; border-bottom: 1px solid var(--wash); }
    .kpi .khname { font-weight: 600; padding-top: var(--sp-2); }
    .kpi .kcells { display: flex; flex-wrap: wrap; gap: var(--sp-4); }
    .kpi .kcell { width: 200px; box-sizing: border-box; padding: var(--sp-3) var(--sp-4); border-radius: var(--r-m); background: var(--wash); display: flex; flex-direction: column; gap: var(--sp-1); }
    .kpi .kcell.on { box-shadow: inset 0 0 0 1px var(--accent); }
    .kpi .kname { font-size: var(--fs-small); color: var(--muted); cursor: help; }
    .kpi .kvalue { font-size: var(--fs-window); font-weight: 600; white-space: nowrap; line-height: 24px; }
    .kpi .kvalue.muted { font-size: var(--fs-body); font-weight: 400; }
    .kpi .kspark { display: block; margin: var(--sp-1) 0; }
    .kpi .kspark rect { fill: var(--off); }
    .kpi .kspark rect.klast { fill: var(--accent); }
    .kpi .kspark rect:hover { fill: var(--muted); }
    .kpi .kspark .kbase { stroke: var(--line); stroke-width: 1; }
    .kpi .kspark .kmark line { stroke: var(--warn); stroke-width: 1; stroke-dasharray: 2 2; }

    .kpi .kmarks { font-weight: 400; font-size: var(--fs-caption); margin-top: var(--sp-2); }
    .kpi .ksub { font-size: var(--fs-caption); }
    .kpi .kwhy { font-size: var(--fs-small); align-self: flex-start; }
    .kpi .kwhylist { grid-column: 2; padding: var(--sp-3) var(--sp-5); border-left: 2px solid var(--accent); background: var(--wash); }
    .kpi .kwhylist .mlist { margin: var(--sp-2) 0 0; }

    @media (max-width: 720px) { .kpi .khead { grid-template-columns: 1fr; } .kpi .kwhylist { grid-column: 1; } }
    /* ограда панели (src/ui/Guard.tsx): на месте упавшей панели — ошибка и «Закрыть» */
    .guard { position: absolute; left: 50%; top: calc(var(--top-h, 48px) + 8px); transform: translateX(-50%); max-width: min(720px, calc(100% - 16px)); z-index: 6; display: flex; align-items: center; gap: var(--sp-5); padding: var(--sp-4) var(--sp-6); }

    .rsub { margin: var(--sp-2) 0 var(--sp-1) var(--sp-5); }

    .cal { display: grid; grid-template-columns: repeat(7, 28px); gap: var(--sp-1); font-size: var(--fs-caption); }
    .cal span { text-align: center; padding: var(--sp-1) 0; border-radius: var(--r-s); }

    .calkey.short { text-decoration: underline dotted; }
    button.link { background: none; border: none; padding: 0; color: inherit; text-decoration: underline dotted; cursor: pointer; font: inherit; text-align: left; }
    table.rtable { border-collapse: collapse; width: 100%; font-size: var(--fs-small); margin: var(--sp-1) 0 var(--sp-2); }
    table.rtable th { text-align: left; color: var(--muted); font-weight: 500; padding: var(--sp-2) var(--sp-3); border-bottom: 1px solid var(--line); vertical-align: bottom; }
    table.rtable td { padding: var(--sp-2) var(--sp-3); border-bottom: 1px solid var(--wash); vertical-align: top; }
    .nw { white-space: nowrap; }
    /* порядок и поиск в таблицах справочника (Б1в) */
    .ref .rsearch { margin-left: var(--sp-6); width: 180px; padding: var(--sp-2) var(--sp-3); background: var(--sunken); color: var(--text); border: 1px solid var(--line); border-radius: var(--r-m); font: inherit; font-size: var(--fs-small); }
