<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; worker-src 'self' blob:; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self' data: blob:">
  <link rel="icon" href="data:,">
  <title>Farmzavod</title>
  <!-- из bolnitsa: app/index.html @ e0a3491 — изменено: полоса сверху, отладка и состояние (часть 0); карточка вещи — её стиль `.card`, панель склада — своя (3б); планёрка и касса — свои (3в); лаборатория (3г), расписание (3д) и «Кем вы будете» (3е) — свои -->
  <style>
    :root {
      --panel: rgba(22, 30, 34, 0.86);
      --panel-2: rgba(36, 48, 54, 0.92);
      --line: rgba(255, 255, 255, 0.14);
      --text: #e9eef0;
      --muted: #9fb0b6;
      --accent: #2fb5c9;
      --red: #d8392b;
      --yellow: #e7b416;
      --green: #4caf6e;
    }
    html, body { margin: 0; height: 100%; background: #2a3236; color: var(--text); font: 13px/1.35 system-ui, "Segoe UI", Roboto, sans-serif; overflow: hidden; }
    #view { position: absolute; inset: 0; touch-action: none; }
    #ui { position: absolute; inset: 0; pointer-events: none; }
    #ui > * { pointer-events: auto; }
    .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; box-shadow: 0 2px 10px rgba(0,0,0,.25); }
    button { font: inherit; color: var(--text); background: var(--panel-2); border: 1px solid var(--line); border-radius: 4px; padding: 3px 9px; cursor: pointer; }
    button:hover:not(:disabled) { border-color: var(--accent); }
    button.on { background: var(--accent); color: #0b1a1e; border-color: var(--accent); }
    button:disabled { opacity: .45; cursor: default; }
    .top { position: absolute; left: 8px; right: 8px; top: 8px; display: flex; flex-wrap: wrap; align-items: center; gap: 10px; padding: 6px 10px; }
    .top .clock { font-size: 16px; font-weight: 600; min-width: 52px; }
    .top .date { color: var(--muted); min-width: 150px; }
    .top .group, .debug .group { display: inline-flex; gap: 4px; align-items: center; }
    .top .stat b { color: #fff; }
    .top .warn { color: var(--yellow); }
    .top .notice { flex: 1 1 0; min-width: 90px; text-align: right; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .label { color: var(--muted); margin: 0 2px 0 8px; }
    .muted { color: var(--muted); }
    .debug { position: absolute; right: 8px; bottom: 10px; padding: 8px 10px; display: flex; flex-direction: column; gap: 6px; max-width: 420px; }
    .status { position: absolute; left: 50%; top: 45%; transform: translate(-50%, -50%); padding: 12px 18px; font-size: 15px; max-width: 70%; text-align: center; }
    .mono { font-variant-numeric: tabular-nums; font-family: ui-monospace, "Cascadia Mono", Consolas, monospace; }
    .num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
    .nowrap { white-space: nowrap; }
    .sicon { vertical-align: -2px; }
    .close { margin-left: auto; }
    /* карточка вещи (3б) — снизу слева: справа — панель склада */
    .card { position: absolute; left: 8px; bottom: 10px; min-width: 380px; max-width: min(600px, calc(100% - 16px)); max-height: 46%; overflow: auto; padding: 8px 12px; }
    /* склад открыт: карточка — слева от него, под панель не заходит */
    .card.beside { min-width: 0; max-width: min(600px, max(300px, calc(100% - min(760px, calc(100% - 16px)) - 24px))); }
    .cardhead { display: flex; align-items: center; gap: 8px; margin-bottom: 4px; font-size: 15px; }
    .card dl { display: grid; grid-template-columns: 1fr 1fr; gap: 2px 14px; margin: 0; }
    .card dt { color: var(--muted); font-size: 11px; }
    .card dd { margin: 0 0 4px; }
    .card .csec { color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: .04em; margin: 8px 0 2px; }
    .card ul.why, .card ol.hist { margin: 0; padding-left: 18px; }
    .card ol.hist { list-style: none; padding-left: 0; }
    .card ol.hist li { margin: 1px 0; }
    /* панель склада (3б) — справа под полосой */
    .stock { position: absolute; right: 8px; top: calc(var(--top-h, 48px) + 8px); width: min(760px, calc(100% - 16px)); max-height: calc(100% - var(--top-h, 48px) - 72px); overflow: auto; padding: 8px 10px; display: flex; flex-direction: column; gap: 6px; }
    .phead { display: flex; align-items: baseline; gap: 10px; font-size: 15px; }
    .phead .muted { font-size: 12px; }
    .filters { display: flex; flex-wrap: wrap; gap: 4px; }
    table.grid { border-collapse: collapse; width: 100%; }
    table.grid th { text-align: left; color: var(--muted); font-weight: 500; padding: 3px 6px; border-bottom: 1px solid var(--line); cursor: pointer; white-space: nowrap; }
    table.grid th.sorted { color: var(--text); }
    table.grid td { padding: 3px 6px; border-bottom: 1px solid rgba(255,255,255,.06); }
    table.grid tbody tr { cursor: pointer; }
    table.grid tbody tr:hover { background: rgba(47,181,201,.12); }
    .pager { display: flex; align-items: center; gap: 8px; justify-content: flex-end; }
    .pager .muted { margin-right: auto; }
    .empty { padding: 6px; }
    /* планёрка (3в) — большое окно сверху посередине; касса — справа, как склад */
    .bad { color: #ff8a7a; }
    .grow { flex: 1 1 auto; }
    .go { cursor: pointer; }
    .go:hover { color: #fff; text-decoration: underline; text-decoration-color: var(--accent); }
    .morning { position: absolute; left: 50%; top: calc(var(--top-h, 48px) + 8px); transform: translateX(-50%); width: min(820px, calc(100% - 16px)); max-height: calc(100% - var(--top-h, 48px) - 24px); overflow: auto; padding: 10px 14px; display: flex; flex-direction: column; gap: 4px; }
    .msec { color: var(--accent); font-size: 12px; text-transform: uppercase; letter-spacing: .05em; margin: 10px 0 2px; border-bottom: 1px solid var(--line); padding-bottom: 2px; }
    .mblock { margin: 2px 0 4px; }
    .mhead { color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: .04em; }
    .mlist { margin: 0; padding-left: 18px; }
    .mlist li { margin: 1px 0; }
    .morning .main { padding: 6px 8px; border: 1px solid var(--line); border-radius: 4px; background: var(--panel-2); }
    .morning .hint { margin-top: 3px; }
    .mfoot { display: flex; align-items: center; gap: 8px; margin: 8px -14px -10px; padding: 6px 14px 10px; border-top: 1px solid var(--line); position: sticky; bottom: -10px; background: rgba(22, 30, 34, 0.98); }
    .stock .csec { color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: .04em; margin: 6px 0 0; }
    .cashp table.grid tbody tr { cursor: default; }
    .cashsum { display: flex; gap: 24px; margin: 0; }
    .cashsum dt { color: var(--muted); font-size: 11px; }
    .cashsum dd { margin: 0; font-size: 18px; font-weight: 600; text-align: left; }
    /* лаборатория (3г): строки партий и их испытаний; карта X–Rm */
    .labp table.grid tbody tr { cursor: default; }
    .labp tr.lot td { border-top: 1px solid var(--line); }
    .labp tr.test td { border-bottom: none; padding-top: 1px; padding-bottom: 1px; }
    .labp td.sub { padding-left: 22px; color: var(--muted); }
    .rush { color: var(--yellow); }
    .chartsum { font-size: 12px; }
    svg.chart { background: rgba(0,0,0,.18); border-radius: 4px; }
    svg.chart line { stroke-width: 1; }
    svg.chart .cl line { stroke: var(--accent); }
    svg.chart .lim line { stroke: #ff8a7a; stroke-dasharray: 5 4; }
    svg.chart .spec line { stroke: var(--muted); stroke-dasharray: 2 4; }
    svg.chart text { fill: var(--muted); font-size: 10px; }
    svg.chart .trace { fill: none; stroke: rgba(255,255,255,.35); stroke-width: 1; }
    svg.chart .pt { fill: var(--text); }
    svg.chart .pt.bad { fill: #ff8a7a; }
    /* расписание (3д) — большое окно во всю ширину под полосой: строки — комплектовка, помещения, линия; полосы — по времени */
    .gantt { position: absolute; left: 8px; right: 8px; top: calc(var(--top-h, 48px) + 8px); max-height: calc(100% - var(--top-h, 48px) - 24px); overflow: auto; padding: 8px 10px; display: flex; flex-direction: column; gap: 2px; }
    .gantt .phead .filters { margin-left: 12px; }
    .grow-row { display: flex; align-items: stretch; min-height: 30px; }
    .glabel { flex: 0 0 180px; padding: 7px 8px 0 0; color: var(--muted); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .gtrack { position: relative; flex: 1 1 auto; border-bottom: 1px solid rgba(255,255,255,.06); overflow: hidden; }
    .gaxis { min-height: 20px; }
    .gaxis .gtrack { border-bottom: 1px solid var(--line); }
    .gtick { position: absolute; top: 0; bottom: 0; border-left: 1px solid rgba(255,255,255,.08); }
    .gtick.day { border-left-color: rgba(255,255,255,.3); }
    .gtick span { position: absolute; left: 3px; top: 3px; font-size: 10px; color: var(--muted); white-space: nowrap; }
    .gday { position: absolute; top: 0; bottom: 0; border-left: 1px solid rgba(255,255,255,.18); }
    .goff { position: absolute; top: 0; bottom: 0; background: rgba(0,0,0,.24); }
    .gnow { position: absolute; top: 0; bottom: 0; width: 2px; margin-left: -1px; background: var(--yellow); pointer-events: none; }
    .gbar { --c: #2fb5c9; position: absolute; top: 4px; bottom: 4px; box-sizing: border-box; border-radius: 3px; padding: 0 4px; font-size: 11px; line-height: 20px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: #0b1a1e; background: var(--c); border: 1px solid var(--c); cursor: pointer; user-select: none; }
    .gbar.k-kit { --c: #d9b45a; }
    .gbar.k-clean { --c: #8fa7c4; top: 9px; bottom: 9px; line-height: 10px; font-size: 9px; }
    .gbar.k-setup { --c: #b89ad8; }
    .gbar.k-pack { --c: #6fc28a; }
    .gbar.w-past { opacity: .6; }
    .gbar.w-now { box-shadow: inset 3px 0 0 #fff; }
    .gbar.w-plan { background: color-mix(in srgb, var(--c) 32%, transparent); border-style: dashed; color: var(--text); }
    .gbar.material { background-image: repeating-linear-gradient(45deg, rgba(0,0,0,.3) 0 4px, transparent 4px 8px); }
    .gbar.repair { box-shadow: inset 0 -3px 0 var(--red); }
    .gbar.move { cursor: grab; }
    .gbar.move:active { cursor: grabbing; }
    .gbar:focus-visible { outline: 2px solid #fff; outline-offset: 1px; }
    .gbar.dim { opacity: .25; }
    .gbar.ghost { background: transparent; border: 2px dashed #fff; color: #fff; pointer-events: none; z-index: 2; }
    .gfoot { display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: center; margin-top: 6px; font-size: 12px; }
    .glegend { display: inline-flex; flex-wrap: wrap; gap: 6px; }
    .glegend .gbar { position: static; display: inline-block; padding: 0 6px; line-height: 18px; cursor: default; }
    .goff-key { display: inline-block; padding: 0 6px; line-height: 18px; background: rgba(0,0,0,.35); border-radius: 3px; color: var(--muted); }
    .gtip { position: fixed; z-index: 10; max-width: 380px; padding: 6px 10px; font-size: 12px; pointer-events: none; }
    /* «Кем вы будете» (3е) — посередине поверх всего: пять плиток мест */
    .seats { position: absolute; left: 50%; top: calc(var(--top-h, 48px) + 16px); transform: translateX(-50%); width: min(1100px, calc(100% - 16px)); max-height: calc(100% - var(--top-h, 48px) - 32px); overflow: auto; padding: 12px 14px; display: flex; flex-direction: column; gap: 10px; z-index: 5; background: rgba(22, 30, 34, 0.97); box-shadow: 0 6px 30px rgba(0,0,0,.5); }
    .tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 8px; }
    .tile { display: flex; flex-direction: column; gap: 6px; align-items: stretch; text-align: left; padding: 10px; font-size: 12px; line-height: 1.35; white-space: normal; }
    .tile .tname { font-size: 15px; }
    .tile.on { background: rgba(47,181,201,.18); color: var(--text); border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
    .tile .tkey { color: var(--muted); }
    .tile .tnote { color: var(--yellow); }
    .tile:disabled { opacity: .6; }
    .tile:focus-visible { outline: 2px solid #fff; outline-offset: 1px; }
    .sfoot { display: flex; align-items: center; gap: 12px; }
    .sfoot .muted { margin-right: auto; }
    .seatbtn { max-width: 280px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  </style>
</head>
<body>
  <div id="view"></div>
  <div id="ui"></div>
  <script src="./app.js"></script>
</body>
</html>
