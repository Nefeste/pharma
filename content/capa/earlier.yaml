# CAPA (Б5е; геймдизайн, §6.4): заменять узел раньше — порог замены по наработке у политики главного механика (Б5г) на
# шаг ниже, после отказа — у верха пределов. Само действие денег не стоит: замен и запчастей больше. По итогам
# расследования определяют и предпринимают корректирующие и предупреждающие действия (gmp-eaeu, ч. I, п. 1.4 (xiv);
# ich-q10, п. 3.2.2); какое действие при каком роде причины — гипотеза геймдизайна. Правило начальника ООК берёт его
# первым при износе узла.
