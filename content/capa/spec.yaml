# CAPA (Д1): испытание во входном контроле — ввести в силу редакцию спецификации материала с испытанием, которого в
# действующей нет, и его методику; в силе — со дня после срока предупреждения обучения, когда аналитики её изучат (Б3б).
# Размер частиц субстанции испытывают, когда он влияет на растворение (ich-q6a, п. 3.3.1 b); изменение спецификации —
# через управление изменениями: оценка до, одобрение, ввод, оценка после — проверка эффективности (gmp-eaeu, ч. I,
# п. 1.4 (xii), (xiii); ich-q10). Правило начальника ООК берёт его первым, когда причина — партия поставщика и такая
# редакция есть (docs/specs/2026-11-fill.md, «Д1»)
