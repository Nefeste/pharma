# Размер частиц АФС (d50): крупнее частицы — медленнее растворение. Сильнее всего — у плохо растворимых веществ: у
# хорошо растворимого парацетамола влияние мало — коэффициент маленький; ибупрофен — класс II БКС, растворимость зависит
# от pH (potthast-2005), — у него свой, больший вклад сверх общего (Д1). Величины — гипотезы.
id: cause.api.particle
name: { ru: Крупная фракция АФС, en: Coarse API particles }
driver: { lots: api, attr: particle }
effects:
  - { attr: dissolution, coef: -0.05 }
  # ибупрофен (Д1): на 50 мкм крупнее обычного — растворение ниже предела спецификации балка (93 → около 83 %)
  - { attr: dissolution, coef: -0.15, products: [prd.ibuprofen200] }
source: [ich-q6a, gao-2021, kalantzi-2006, potthast-2005]
review: draft
