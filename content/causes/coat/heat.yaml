# Перегрев слоя у ибупрофена (Б7д, шаг 3): нагрев при нанесении и сушке приводил к провалам растворения таблеток после
# хранения (fda-osd-1994, ч. V, «Coating Equipment» — без продукта), растворение таблеток ибупрофена при хранении
# снижалось (mpa-ibetin-2021). Стабильности в игре нет (Б7д, «Чего нет») — растворение ниже сразу у балка: упрощение.
# Только у ибупрофена и только выше цели; величина — гипотеза: процентов растворения на °C сверх цели
id: cause.coat.heat
name: { ru: Перегрев слоя — растворение ниже, en: Bed overheating — lower dissolution }
driver: { param: bedTemp }
products: [prd.ibuprofen200]
side: above
effects:
  - { attr: dissolution, coef: -2.5 }
source: [fda-osd-1994, mpa-ibetin-2021]
review: draft
