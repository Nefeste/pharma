# Сито калибратора крупнее карты (часть 4): крупнее ячейка — крупнее гранулы после калибровки (kotamarthy-2020,
# fda-qbd-ir), медленнее растворение таблеток — по аналогии: провал растворения после смены сита мельницы у таблетки с
# оболочкой (fda-osd-1994) и крупные плотные гранулы плохо растворимого вещества (kaul-2011). Для таблетки парацетамола
# без оболочки прямого опыта нет — сверить (docs/10-domain.md, §7). Величины — гипотезы: на каждый миллиметр ячейки
# крупнее карты средний размер гранул — на 400 мкм больше, растворение — на 17 % меньше.
id: cause.mill.screen
name: { ru: Сито калибратора крупнее карты, en: Mill screen coarser than specified }
driver: { screen: true }
effects:
  - { attr: granule, coef: 400 }
  - { attr: dissolution, coef: -17 }
source: [fda-osd-1994, kaul-2011, kotamarthy-2020, fda-qbd-ir]
review: draft
