# Скорость ротора не по цели (Б1ж). Направление — факты с источниками (docs/10-domain.md, §6): с ростом скорости
# прессования прочность падает (akande-1997), склонность к кэппингу растёт (sarkar-2015, kalies-2020); на высокой скорости
# матрица не успевает заполниться под питателем, и разброс массы таблеток шире (schomberg-2020). Величины — гипотезы
# геймдизайна: единиц показателя на 1 об/мин отхода от цели. О лоратадине источников нет — та же запись, что у парацетамола.
id: cause.press.speed
name: { ru: Скорость ротора не по цели, en: Turret speed off target }
driver: { param: speed }
# на каждый об/мин сверх цели: прочность ниже, истираемость выше; медленнее цели — наоборот
effects:
  - { attr: hardness, coef: -0.8 }
  - { attr: friability, coef: 0.01 }
# разброс массы по ходу стадии, % массы на каждый об/мин сверх цели; медленнее цели матрица заполняется, разброс прежний
scatter:
  - { attr: mass, coef: 0.08 }
source: [akande-1997, sarkar-2015, kalies-2020, schomberg-2020]
review: draft
