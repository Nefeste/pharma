# Коатер с перфорированным барабаном (Б7д): барабан с перегородками, форсунки над слоем таблеток, горячий воздух
# проходит сквозь слой (pmc-pancoat-2025, §2.1). Барабан 122 см — загрузка 120–160 кг, 3–4 форсунки
# (coat-params-2011): серия парацетамола 120 кг входит. Мойка — автоматическая (cip-coater-2021)
id: eq.coater
name: { ru: Коатер с перфорированным барабаном, en: Perforated pan coater }
# ширина, глубина, высота, м — след на полу: гипотеза, сверить
size: [2.4, 1.8, 2.4]
# модель кодом из частей: корпус, барабан на боку, шкаф воздуха — гипотеза, сверить
model:
  - { shape: box, x: 0, z: 0, y: 0.15, w: 2.2, d: 1.6, h: 0.3, color: grey }
  - { shape: box, x: -0.3, z: 0, y: 1.15, w: 1.6, d: 1.6, h: 1.7, color: steel }
  - { shape: cyl, axis: x, x: -0.3, z: 0, y: 1.15, w: 1.62, d: 1.22, h: 1.22, color: white, spin: x }
  - { shape: box, x: 0.85, z: 0, y: 1.2, w: 0.5, d: 1.2, h: 2.4, color: grey }
  - { shape: box, x: 0.85, z: 0.62, y: 1.4, w: 0.3, d: 0.06, h: 0.4, color: dark }
# мойка: малая — фазы автоматической мойки барабана 250 л, около 1,5 ч по сумме (cip-coater-2021, табл. 1, сумма —
# вывод); генеральная — вдвое, гипотеза
cleaning: { minor: 90, major: 180 }
kw: 40
qual: { every: 36, hours: 8, price: 120000, name: { ru: Квалификация коатера, en: Coater qualification } }
critical: true
# покупка (Б7в): цена европейского поставщика, ₽ без НДС, — гипотеза в уровне сушилки и смесителя-гранулятора; дни
# монтажа, IQ, OQ и PQ — гипотезы
price: 32000000
install: { days: 3, iq: 2, oq: 2, pq: 3 }
source: [gmp-eaeu, minprom-965-2009, pmc-pancoat-2025, coat-params-2011, cip-coater-2021]
review: draft
