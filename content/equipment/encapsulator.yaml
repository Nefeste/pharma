# Капсулонаполнительная машина с дозирующим диском (Б8): класс «капсулонаполнительная машина», подкласс «дозирующий
# диск» — содержимое трамбуют в отверстия диска (fda-supac-me, §IV.E.2.b). Операции — ориентация капсул, разъединение,
# дозирование, соединение, выброс (§IV.E.1.b.ii); обеспыливание и полировка — в работе машины, отдельной стадии нет
# (docs/specs/2026-10-vertical-slice.md, «Решения агента»). Узел с износом — дозирующий диск и трамбующие штифты: ресурс,
# таблица отказов и нагрузка от силы трамбовки — гипотезы
id: eq.encapsulator
name: { ru: Капсулонаполнительная машина, en: Capsule filling machine }
# ширина, глубина, высота, м — след на полу: гипотеза, сверить
size: [1.4, 1.2, 2.0]
# модель кодом из частей: станина, поворотный стол с сегментами, бункер капсул, бункер содержимого, лоток выброса,
# пульт — гипотеза, сверить
model:
  - { id: body, shape: box, x: 0, z: 0, y: 0.45, w: 1.3, d: 1.1, h: 0.9, color: white }
  - { id: rotor, shape: cyl, x: 0, z: 0, y: 1.0, w: 0.8, d: 0.8, h: 0.2, color: steel, spin: y }
  - { id: cover, shape: glass, x: 0, z: 0, y: 1.25, w: 1.0, d: 1.0, h: 0.7, cover: true }
  - { id: hopper, shape: cone, x: -0.3, z: 0, y: 1.8, w: 0.4, d: 0.4, h: 0.3, bottom: 0.12, color: steel }
  - { id: shells, shape: box, x: 0.3, z: 0, y: 1.8, w: 0.35, d: 0.35, h: 0.3, color: grey }
  - { id: chute, shape: box, x: 0.5, z: -0.35, y: 0.75, w: 0.3, d: 0.15, h: 0.08, color: steel }
  - { id: panel, shape: box, x: 0.67, z: 0.3, y: 1.3, w: 0.06, d: 0.3, h: 0.4, color: dark }
# мойка: малая — разборка сегментов и диска, генеральная — с бункерами; гипотеза
cleaning: { minor: 60, major: 180 }
kw: 10
parts:
  - id: disc
    name: { ru: Дозирующий диск и штифты, en: Dosing disc and tamping pins }
    # капсул комплектом — гипотеза
    life: 30000000
    hazard: [[0, 0.003], [50, 0.01], [80, 0.05], [100, 0.2], [120, 0.8]]
    # разброс МОК при износе 100 %: % массы содержимого — гипотеза
    scatter: { mass: 0.6 }
    # нагрузка (Б1ж): сила трамбовки выше цели — на каждые 0,01 кН сверх цели наработка на капсулу больше на 1 %
    # (гипотеза)
    stress: { param: tamp, coef: 100 }
    spare: spare.disc
    replace: 90
    repair: [120, 240]
qual: { every: 36, hours: 6, price: 100000, name: { ru: Квалификация капсулонаполнительной машины, en: Capsule filler qualification } }
critical: true
# покупка (Б7в): цена европейского поставщика, ₽ без НДС, — гипотеза в уровне цен Б7в, дешевле пресса; дни монтажа, IQ,
# OQ и PQ — гипотезы
price: 14000000
install: { days: 2, iq: 2, oq: 2, pq: 3 }
source: [fda-supac-me, gmp-eaeu, minprom-965-2009]
review: draft
