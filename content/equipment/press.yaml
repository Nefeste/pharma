# Роторный таблеточный пресс. Узел с износом — комплект пуансонов и матриц (геймдизайн, §7.1; docs/specs/2026-10-engine.md,
# 1е): наработка — таблетки стадий пресса, износ — наработка / средний ресурс комплекта по истории завода (caruso-2008).
# Ресурс — того же порядка, что в старых ТУ (ru-press-tool: не меньше 500 / 150 / 100 ч при 100 тыс. таблеток в час для
# неагрессивной, абразивной и агрессивной массы; абразивна ли масса парацетамола, источники не говорят). Таблица
# отказов, разброс МОК, времена замены и ремонта — гипотезы.
id: eq.press
name: { ru: Роторный таблеточный пресс, en: Rotary tablet press }
# ширина, глубина, высота, м — след на полу (docs/specs/2026-10-view.md, 2а): гипотеза, сверить
size: [1.2, 1.2, 2.0]
# модель кодом из частей (docs/13-art.md, §8; docs/specs/2026-10-view.md, 2в): силуэт класса, м — гипотеза, сверить.
# Имена частей — узлы модели из Blender (blender/press.py): станина, ротор, кожух, головка, бункер, пульт
model:
  - { id: body, shape: box, x: 0, z: 0, y: 0.45, w: 1.1, d: 1.1, h: 0.9, color: white }
  - { id: rotor, shape: cyl, x: 0, z: 0, y: 1.12, w: 0.7, d: 0.7, h: 0.3, color: steel, spin: y }
  - { id: cover, shape: glass, x: 0, z: 0, y: 1.2, w: 1.12, d: 1.12, h: 0.6, cover: true }
  - { id: head, shape: box, x: 0, z: 0, y: 1.65, w: 1.1, d: 1.1, h: 0.3, color: white }
  - { id: hopper, shape: cone, x: 0, z: 0, y: 1.9, w: 0.45, d: 0.45, h: 0.2, bottom: 0.15, color: steel }
  - { id: panel, shape: box, x: 0.57, z: 0.3, y: 1.3, w: 0.06, d: 0.3, h: 0.4, color: dark }
cleaning: { minor: 60, major: 360 }
kw: 15
parts:
  - id: punches
    name: { ru: Пуансоны и матрицы, en: Punches and dies }
    # таблеток комплектом
    life: 20000000
    # от износа, % — отказов на миллион таблеток: износовая ветвь «ванны» (nist-handbook), отказ — отлом кромки или
    # заклинивание (higgins-2015, tc-tool-maint)
    hazard: [[0, 0.005], [50, 0.02], [80, 0.1], [100, 0.4], [120, 1.2]]
    # разброс МОК при износе 100 %: разная рабочая длина в комплекте (natoli-wl), % массы и Н
    scatter: { mass: 0.5, hardness: 5 }
    # нагрузка (Б1ж): уставка силы выше цели карты — на каждый кН сверх цели наработка на таблетку больше на столько %.
    # У пуансона есть предел силы для бесконечного числа циклов (tsm-apha); насколько быстрее износ ниже него — гипотеза
    stress: { param: force, coef: 10 }
    spare: spare.punches
    # минуты: замена по плану; ремонт после отказа — диагностика и замена, от и до
    replace: 120
    repair: [150, 300]
# квалификация (Б3в; геймдизайн, §7.2): повторная — через столько месяцев, часов работы подрядчика и цена, ₽ без
# НДС; квалифицируют оборудование, на котором валидируют процесс (прил. 15 GMP ЕАЭС, п. 5.9). Критическое — для
# перечня в досье площадки (ч. III, прил. 8). Часы и цены — гипотезы
qual: { every: 36, hours: 8, price: 150000, name: { ru: Квалификация пресса, en: Press qualification } }
critical: true
source: [caruso-2008, ru-press-tool, natoli-wl, higgins-2015, tsm-apha, gmp-eaeu]
review: draft
