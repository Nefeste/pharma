# Вакуумная перегрузка (Б7г, шаг 2): порошок и гранулят — из грануляции в смешивание и из смешивания в таблетирование по
# линии через перегородку, плотной фазой, которая годится для подачи смеси на пресс (`pharmtech-vac-2010`); насос и
# приёмник — у стены, линия — через стену (`tc-vac-2018`). Единица стоит в помещении, откуда идёт продукт, у стены с
# помещением следующей стадии; моется с оборудованием этого помещения
id: eq.vacuum
name: { ru: Вакуумная перегрузка, en: Vacuum transfer }
# ширина, глубина, высота, м — след на полу: гипотеза, сверить
size: [0.8, 0.8, 2.0]
# модель кодом из частей: насос внизу, приёмник с конусом сверху, линия к стене — гипотеза, сверить
model:
  - { shape: box, x: 0, z: 0, y: 0.25, w: 0.6, d: 0.6, h: 0.5, color: grey }
  - { shape: cyl, x: 0, z: 0, y: 1.2, w: 0.5, d: 0.5, h: 0.8, color: steel }
  - { shape: cone, x: 0, z: 0, y: 0.7, w: 0.5, d: 0.5, h: 0.3, bottom: 0.12, color: steel }
  - { shape: cyl, axis: x, x: 0.3, z: 0, y: 1.75, w: 0.2, d: 0.08, h: 0.08, color: white }
# мойка разборкой — «меньше часа» (`tc-vac-2018`); генеральная — вдвое, гипотеза
cleaning: { minor: 60, major: 120 }
kw: 3
# перегрузка (Б7г): производительность, кг/ч, — материалы производителей, около 450 и до 680 кг/ч (`tc-vac-2018`, по
# поиску); пуск и конец, мин, — проверка соединения, пуск, отсоединение (`gmp-eaeu`, ч. I, п. 5.14): меньше ручной
# работы, чем у тележки, — то, что перегрузка даёт по источникам (`tc-vac-2018`); число — гипотеза. Из помещения какого
# типа в какое
transfer:
  kgh: 500
  setup: 5
  pairs: [[granulation, blending], [blending, compression]]
qual: { every: 36, hours: 4, price: 60000, name: { ru: Квалификация вакуумной перегрузки, en: Vacuum transfer qualification } }
critical: true
# покупка (Б7в): цена европейского поставщика, ₽ без НДС, — гипотеза в пределах уровня цен Б7в; монтаж на день дольше
# обеспыливателя — линия через стену
price: 5000000
install: { days: 2, iq: 1, oq: 2, pq: 2 }
source: [gmp-eaeu, tc-vac-2018, pharmtech-vac-2010, minprom-965-2009]
review: draft
