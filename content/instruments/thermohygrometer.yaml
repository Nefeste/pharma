# Датчик системы мониторинга условий хранения (Б3в): температура и влажность помещения хранения круглые сутки. Условия
# хранения контролируют поверенными средствами измерений или автоматизированной системой мониторинга (приказ № 260н,
# пп. 11, 18; GDP ЕАЭС, п. 41) — запись у датчика называется поверкой. Интервал поверки задаёт описание типа
# средства измерений (docs/10-domain.md, §8); здесь, часы и цена, ₽ без НДС, — гипотезы
id: inst.thermohygrometer
name: { ru: Термогигрометр, en: Thermohygrometer }
cal: { every: 12, hours: 1, price: 3000, name: { ru: Поверка датчика, en: Sensor verification }, verify: true }
# покупка (Б7в; геймдизайн, §5.2): цена европейского поставщика, ₽ без НДС, — у других по их доле; дни монтажа и,
# у класса с квалификацией, IQ, OQ и PQ — рабочие дни инженера поставщика и инженера по валидации. Цена — доля
# уровня оборудования по Стратегии Минпромторга (`minprom-965-2009`, вывод), дни — гипотезы (docs/specs/
# 2026-10-vertical-slice.md, «Б7в», «Числа»)
price: 30000
install: { days: 0 }
source: [mz-260n, gdp-eaeu, minprom-965-2009]
review: draft
