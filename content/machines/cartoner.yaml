# Картонажная машина с модулем маркировки (геймдизайн, §5.6–5.7; docs/10-domain.md, §3, §6): складывает пачку, кладёт в
# неё блистеры и инструкцию, печатает код DataMatrix; камера сбрасывает пачку, код которой не прочитан. Переналадка на
# другой размер пачки — смена форматных частей наладчиком. Скорость, микроостановки, брак и время переналадки — гипотезы.
id: mach.cartoner
name: { ru: Картонажная машина с маркировкой, en: Cartoner with serialisation }
# ширина, глубина, высота, м — след на полу (docs/specs/2026-10-view.md, 2а): гипотеза, сверить
size: [4.5, 1.6, 1.8]
# модель кодом из частей (docs/13-art.md, §8; docs/specs/2026-10-view.md, 2в): силуэт класса, м — гипотеза, сверить
model:
  - { shape: box, x: 0, z: 0, y: 0.5, w: 4.5, d: 1.3, h: 1.0, color: white }
  - { shape: box, x: 0, z: 0, y: 1.02, w: 4.5, d: 1.4, h: 0.04, color: steel }
  - { shape: glass, x: 0, z: 0, y: 1.35, w: 3.6, d: 1.2, h: 0.6, cover: true }
  - { shape: box, x: 1.2, z: -0.45, y: 1.4, w: 0.5, d: 0.4, h: 0.7, color: grey }
  - { shape: belt, x: 1.9, z: 0.2, y: 1.06, w: 0.6, d: 0.2, h: 0.04, item: blister }
  - { shape: belt, x: -0.3, z: 0.2, y: 1.06, w: 3.0, d: 0.25, h: 0.04, item: carton }
  - { shape: box, x: -1.5, z: -0.3, y: 1.5, w: 0.3, d: 0.4, h: 0.4, color: dark }
  - { shape: box, x: 0.6, z: 0.75, y: 1.4, w: 0.4, d: 0.06, h: 0.3, color: dark }
item: carton
nominal: 70
crew: { role: role.line-operator, n: 1 }
micro: { every: 25, duration: 1.5 }
reject: 0.3
changeover: 180
kw: 6
# заминка — каждая микроостановка: портит пачку с инструкцией, это обычная причина отходов упаковки (sgs-glossary). Как
# часто испорченное не записывают — гипотеза: скрытая потеря «на несколько секунд» (pharmtech-oee)
jam: { cartons: 1, uncounted: 5 }
# квалификация (Б3в; геймдизайн, §7.2): повторная — через столько месяцев, часов работы подрядчика и цена, ₽ без
# НДС; оборудование первичной и вторичной упаковки квалифицируют (прил. 15 GMP ЕАЭС, п. 7.1). Часы и цены — гипотезы
qual: { every: 36, hours: 8, price: 120000, name: { ru: Квалификация картонажной машины, en: Cartoner qualification } }
critical: true
source: [mdlp, sgs-glossary, pharmtech-oee, gmp-eaeu]
review: draft
