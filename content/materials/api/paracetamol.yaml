# АФС прототипа. Хранение и срок повторных испытаний — выбор геймдизайна для прототипа; настоящие — по паспорту
# изготовителя и НД, сверить с консультантом.
id: mat.api.paracetamol
kind: api
code: 100001
name: { ru: Парацетамол, en: Paracetamol }
unit: kg
container: cnt.drum.fibre50
storage: room
shelf: 36
potency: true
spec: spec.mat.api.paracetamol
# истинные свойства партии: среднее и разброс (содержание и влажность — %, размер частиц d50 — мкм); партия брака —
# сдвиг (гипотезы). Размер частиц спецификация не испытывает: его видно только по растворению серий
props: { assay: [99.7, 0.1], moisture: [0.2, 0.05], particle: [50, 10] }
bad: { attr: assay, shift: -3 }
# проба с тары: граммы или штуки
sample: 20
