# Второй продукт этапа Б (Б2б; решение владельца по #58): таблетки лоратадина 10 мг без оболочки — такие
# зарегистрированы в ЕС и в РФ (docs/10-domain.md, §7). МНН — латиницей.
id: prd.loratadine10
name: { ru: "Лоратадин, таблетки 10 мг", en: "Loratadine 10 mg tablets" }
inn: loratadine
# код препарата — PP в номере серии PPNNNMMYY: вымышленный; не менять — по нему записаны номера серий
code: LO
form: tablet
# дозировка — действующего вещества в таблетке, мг (Б3а): полем, а не только в имени
strength: { mg: 10 }
# в перечне ЖНВЛП: твёрдые формы для приёма внутрь с обычным высвобождением (распоряжение № 3867-р, с. 103 копии)
jnvlp: true
source: [jnvlp-3867, meb-loratadine-2022, ru-loratadine]
review: draft
