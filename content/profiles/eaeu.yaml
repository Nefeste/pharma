# Регуляторный профиль ЕАЭС/РФ (ADR 0004). Факты и источники — docs/10-domain.md, §3.
id: prf.eaeu
name: { ru: ЕАЭС / РФ, en: EAEU / Russia }
currency: RUB
vat:
  medicines: 10   # подп. 4 п. 2 ст. 164 НК РФ: лекарственные средства, включая фармацевтические субстанции
  general: 22     # с 01.01.2026, ФЗ № 425-ФЗ
vatDue: 28        # НДС за квартал — тремя равными долями до 28-го (ст. 174 НК РФ)
marking:
  packs: true            # ПП РФ № 1556: код на каждой пачке
  aggregation: optional  # агрегирование не обязательно
  fee: 0.5               # ₽ за код без НДС (ПП РФ № 577)
  free: 20               # бесплатно для ЖНВЛП с предельной ценой не выше 20 ₽
payroll:
  night: { from: 22, to: 6, extra: 20 }   # ст. 154 ТК РФ; ПП РФ № 436: не меньше 20 % часовой ставки
  # сверхурочные (Б4а): не больше 4 ч в день и 120 ч в год (ст. 99 ТК РФ, ред. ФЗ № 144-ФЗ; в игре «в день» — за смену,
  # толкование сверить); первые 2 ч — в полуторном размере, дальше — в двойном (ст. 152)
  overtime: { shift: 4, year: 120, first: 2, rates: [150, 200] }
  # работа окладника в выходной или праздник: ставка сверх оклада в пределах месячной нормы, двойная — сверх (ст. 153)
  holiday: { within: 100, beyond: 200 }
  # 30 % до предельной базы 2026 года и 15,1 % сверх (ст. 425 НК РФ; ПП РФ № 1705); «на травматизм» — 0,2 % (179-ФЗ:
  # от 0,2 до 8,5 % по классу риска; класс фармацевтического производства — сверить); до 28-го (ст. 431 НК РФ)
  contrib: { rate: 30, base: 2979000, above: 15.1, injury: 0.2, due: 28 }
# производственный календарь (Б4а): нерабочие праздники — месяц и число (ст. 112 ТК РФ); выходной, совпавший с праздником,
# переносится на следующий рабочий день, кроме совпавших с 1–8 января; переносы постановлением Правительства — с какого
# дня на какой: на 2027 год — ПП РФ № 1187 от 17.09.2026, на 2028 год постановления ещё нет; накануне праздника рабочий
# день на час короче (ст. 95); норма — по расчётной пятидневке при 40 часах в неделю (Порядок 588н)
calendar:
  holidays: [[1, 1], [1, 2], [1, 3], [1, 4], [1, 5], [1, 6], [1, 7], [1, 8], [2, 23], [3, 8], [5, 1], [5, 9], [6, 12], [11, 4]]
  january: [1, 8]
  transfers:
    - [2027-01-02, 2027-11-05]
    - [2027-01-03, 2027-12-31]
    - [2027-02-20, 2027-02-22]
  short: 1
  week: 40
energy:
  advances: [[10, 30], [25, 40]]   # ПП РФ № 442, п. 82: 30 % до 10-го, 40 % до 25-го от стоимости прошлого месяца
  final: 18                        # остаток — до 18-го следующего месяца
key: 14   # ключевая ставка Банка России с 27.07.2026, сохранена 11.09.2026
# коды единиц по ОКЕИ (ОК 015-94): для справочника и обмена с другими системами; движок считает в своих целых
okei: { mg: 161, g: 163, kg: 166, pcs: 796, pack: 778 }
# найм и увольнение (Б4в): испытание при приёме — не дольше 3 месяцев (ст. 70 ТК РФ); по собственному желанию уходят через
# 14 дней после заявления (ст. 80), на испытании — через 3 дня (ст. 71, ч. 4); не выдержавшего испытание предупреждают не
# позже чем за 3 дня (ст. 71, ч. 1)
labor: { probation: 3, notice: 14, trial: 3 }
source: [gmp-eaeu, mdlp, rzn-mdlp, nk-164, nk-vat, pp-577, tk-154, pp-436, tk-99, tk-152, tk-153, tk-91, tk-95, tk-112, pp-1187, mzsr-588n, nk-425, pp-1705, nk-431, fz-434, pp-442, cbr-key, okei, tk-70, tk-71, tk-80]
review: draft
