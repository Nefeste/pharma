# Завод прототипа (docs/specs/2026-10-prototype.md, «Что в прототипе»; docs/specs/2026-10-engine.md). Штат, техника,
# запас и первые заказы — гипотезы геймдизайна. Касса — рубли.
id: scn.proto
name: { ru: Прототип, en: Prototype }
profile: prf.eaeu
plant: plant.proto
start: { date: 2027-09-01, hour: 7 }
seed: 20271001
site: { w: 60, h: 40 }
cash: 30000000
# кредитная линия: предел минуса, ₽, и надбавка к ключевой ставке, п. п. (около средней ставки банков, cbr-rates);
# цена электроэнергии, ₽ за кВт·ч без НДС, — в пределах цен 2026 года (tosk-2026). Гипотезы
credit: { limit: 20000000, spread: 4 }
energy: { price: 9.5 }
customers: [cus.national, cus.regional]
staff:
  - { role: role.storekeeper, shift: shift.day, skill: 3, n: 2 }
  - { role: role.driver, shift: shift.day, skill: 3, n: 2 }
  - { role: role.sampler, shift: shift.day, skill: 3, n: 1 }
  - { role: role.analyst, shift: shift.day, skill: 3, n: 3 }
  - { role: role.qc-head, shift: shift.day, skill: 4, n: 1 }
  - { role: role.qa, shift: shift.day, skill: 3, n: 1 }
  - { role: role.qp, shift: shift.day, skill: 4, n: 1 }
  - { role: role.operator, shift: shift.a, skill: 3, n: 3 }
  - { role: role.operator, shift: shift.b, skill: 3, n: 3 }
  - { role: role.master, shift: shift.a, skill: 4, n: 1 }
  - { role: role.master, shift: shift.b, skill: 3, n: 1 }
  - { role: role.line-operator, shift: shift.a, skill: 3, n: 2 }
  - { role: role.line-operator, shift: shift.b, skill: 3, n: 2 }
  - { role: role.packer, shift: shift.a, skill: 3, n: 2 }
  - { role: role.packer, shift: shift.b, skill: 3, n: 2 }
  - { role: role.mechanic, shift: shift.a, skill: 3, n: 1 }
  - { role: role.mechanic, shift: shift.b, skill: 3, n: 1 }
  - { role: role.setter, shift: shift.day, skill: 3, n: 1 }
vehicles:
  - { type: veh.jack, n: 2 }
  - { type: veh.reach, n: 1 }
# заказы поставщикам в первую секунду партии: упаковка и вспомогательные приходят в первый месяц, АФС — позже
orders:
  - supplier: sup.exc
    lines:
      - { material: mat.exc.starch, qty: 500 }
      - { material: mat.exc.mcc, qty: 200 }
  - supplier: sup.pack
    lines:
      - { material: mat.pk.carton-n20, qty: 40000 }
      - { material: mat.pk.carton-n10, qty: 20000 }
      - { material: mat.pk.leaflet, qty: 100000 }
      - { material: mat.pk.case, qty: 500 }
  - supplier: sup.api
    lines:
      - { material: mat.api.paracetamol, qty: 1000 }
# задания на серию: раз в неделю, день — от начала партии, и позиция, в которую упаковать балк. АФС на складе хватит на
# пять серий, дальше — из заказа; №10 и №20 чередуются, чтобы линия переналаживалась
batches:
  - { recipe: rcp.paracetamol500.wet.v1, day: 1, sku: sku.paracetamol500.n20 }
  - { recipe: rcp.paracetamol500.wet.v1, day: 8, sku: sku.paracetamol500.n10 }
  - { recipe: rcp.paracetamol500.wet.v1, day: 15, sku: sku.paracetamol500.n20 }
  - { recipe: rcp.paracetamol500.wet.v1, day: 22, sku: sku.paracetamol500.n20 }
  - { recipe: rcp.paracetamol500.wet.v1, day: 29, sku: sku.paracetamol500.n10 }
  - { recipe: rcp.paracetamol500.wet.v1, day: 36, sku: sku.paracetamol500.n20 }
  - { recipe: rcp.paracetamol500.wet.v1, day: 43, sku: sku.paracetamol500.n10 }
  - { recipe: rcp.paracetamol500.wet.v1, day: 50, sku: sku.paracetamol500.n20 }
# завод не новый: износ узлов на старте, %. Техслужба меняет пуансоны по наработке — при износе 100 %, как только пресс
# свободен; плиту запайки — по отказу (docs/specs/2026-10-engine.md, 1е). Гипотезы
wear: { press-1/punches: 94, blister-1/sealplate: 85 }
maint: { press-1/punches: 100 }
# мастер линии: сменное задание — 70 % номинала узкого места за смену, если у линии есть задание на упаковку (гипотеза:
# норма выработки старой линии)
norm: 70
# запас на старте — разрешённые партии на стеллажах: хватает на первые серии
stock:
  - { material: mat.api.paracetamol, qty: 600 }
  - { material: mat.exc.starch, qty: 250 }
  - { material: mat.exc.povidone, qty: 75 }
  - { material: mat.exc.mcc, qty: 100 }
  - { material: mat.exc.mgst, qty: 20 }
  - { material: mat.pk.pvc, qty: 250 }
  - { material: mat.pk.alu, qty: 200 }
  - { material: mat.pk.carton-n10, qty: 40000 }
  - { material: mat.pk.carton-n20, qty: 20000 }
  - { material: mat.pk.leaflet, qty: 50000 }
  - { material: mat.pk.case, qty: 500 }
