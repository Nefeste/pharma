# Завод прототипа (docs/specs/2026-10-prototype.md, «Что в прототипе»; docs/specs/2026-10-engine.md). Штат, техника,
# запас и первые заказы — гипотезы геймдизайна. Касса — рубли.
id: scn.proto
name: { ru: Прототип, en: Prototype }
profile: prf.eaeu
plant: plant.proto
start: { date: 2027-09-01, hour: 7 }
seed: 20271001
site: { w: 60, h: 40 }
cash: 30000000
# кредитная линия: предел минуса, ₽, и надбавка к ключевой ставке, п. п. (около средней ставки банков, cbr-rates);
# цена электроэнергии, ₽ за кВт·ч без НДС, — в пределах цен 2026 года (tosk-2026). Гипотезы
credit: { limit: 20000000, spread: 4 }
energy: { price: 9.5 }
customers: [cus.national, cus.regional]
# штат — под загрузку плана (Б2в): серия в рабочий день отвешивается в первую смену вдвоём, во вторую стадии ведёт один
# аппаратчик; линия упаковывает серию за 3–4 часа — её смена только первая; при прежнем штате люди были заняты задачами
# пятую часть смены (замер Б2в). Уборщики (Б4в) — по одному в каждой смене аппаратчиков: помещение убирают после мойки
# оборудования. Запас на отпуска (Б4г) — последние три строки: аппаратчик и упаковщик первой смены — отвешиванию и линии
# нужны двое, — и второе уполномоченное лицо — его заменяет только другое (GMP ЕАЭС, ч. I, п. 2.6). Смежные профессии
# (`also`, Б4г) — кому замещать единственных в роли на время отпуска: кладовщик и водитель погрузчика, пробоотборщик и
# химик-аналитик, начальник ОКК и специалист ООК — друг у друга; у наладчика — оператор линии, у слесаря-ремонтника первой
# смены — наладчик. Гипотезы
staff:
  - { role: role.storekeeper, shift: shift.day, skill: 3, n: 1, also: [role.driver] }
  - { role: role.driver, shift: shift.day, skill: 3, n: 1, also: [role.storekeeper] }
  - { role: role.sampler, shift: shift.day, skill: 3, n: 1, also: [role.analyst] }
  - { role: role.analyst, shift: shift.day, skill: 3, n: 1, also: [role.sampler] }
  - { role: role.analyst, shift: shift.day, skill: 3, n: 1 }
  - { role: role.qc-head, shift: shift.day, skill: 4, n: 1, also: [role.qa] }
  - { role: role.qa, shift: shift.day, skill: 3, n: 1, also: [role.qc-head] }
  - { role: role.qp, shift: shift.day, skill: 4, n: 1 }
  - { role: role.operator, shift: shift.a, skill: 3, n: 2 }
  - { role: role.operator, shift: shift.b, skill: 3, n: 1 }
  - { role: role.master, shift: shift.a, skill: 4, n: 1 }
  - { role: role.master, shift: shift.b, skill: 3, n: 1 }
  - { role: role.line-operator, shift: shift.a, skill: 3, n: 2 }
  - { role: role.packer, shift: shift.a, skill: 3, n: 2 }
  - { role: role.mechanic, shift: shift.a, skill: 3, n: 1, also: [role.setter] }
  - { role: role.mechanic, shift: shift.b, skill: 3, n: 1 }
  - { role: role.setter, shift: shift.day, skill: 3, n: 1, also: [role.line-operator] }
  - { role: role.cleaner, shift: shift.a, skill: 3, n: 1 }
  - { role: role.cleaner, shift: shift.b, skill: 3, n: 1 }
  - { role: role.operator, shift: shift.a, skill: 3, n: 1 }
  - { role: role.packer, shift: shift.a, skill: 3, n: 1 }
  - { role: role.qp, shift: shift.day, skill: 4, n: 1 }
vehicles:
  - { type: veh.jack, n: 2 }
  - { type: veh.reach, n: 1 }
# задания на серию первых двух недель — по серии в рабочий день, день — от начала партии, и позиция, в которую упаковать
# балк; три из десяти — лоратадин (Б2б), вторая — парацетамол: на ней происшествие. Дальше задания ставит коллега
# планирования (plan). Гипотезы
batches:
  - { recipe: rcp.paracetamol500.wet.v1, day: 1, sku: sku.paracetamol500.n20 }
  - { recipe: rcp.paracetamol500.wet.v1, day: 2, sku: sku.paracetamol500.n20 }
  - { recipe: rcp.paracetamol500.wet.v1, day: 5, sku: sku.paracetamol500.n10 }
  - { recipe: rcp.loratadine10.wet.v1, day: 6, sku: sku.loratadine10.n30 }
  - { recipe: rcp.paracetamol500.wet.v1, day: 7, sku: sku.paracetamol500.n20 }
  - { recipe: rcp.paracetamol500.wet.v1, day: 8, sku: sku.paracetamol500.n10 }
  - { recipe: rcp.loratadine10.wet.v1, day: 9, sku: sku.loratadine10.n10 }
  - { recipe: rcp.paracetamol500.wet.v1, day: 12, sku: sku.paracetamol500.n20 }
  - { recipe: rcp.loratadine10.wet.v1, day: 13, sku: sku.loratadine10.n30 }
  - { recipe: rcp.paracetamol500.wet.v1, day: 14, sku: sku.paracetamol500.n20 }
# план выпуска (Б2в, src/engine/planner.ts): после заданий сценария их ставит коллега планирования — на тот же день через
# две недели, если ГП позиции с сериями в работе меньше спроса на эти две недели и ещё 21 суток; спрос — по заказам за 28
# последних суток. С двумя продуктами серия позиции покрывает до двух недель спроса, и запаса на 14 суток не хватало (Б2б).
# Кампании (Б2г): продукт последнего задания идёт дальше, пока его позициям нужна серия, а каждой позиции другого продукта
# хватит больше чем на две недели и ещё 10 суток — серия от «не раньше» до выпуска идёт 7 суток по медиане и 9–10 у
# десятой доли самых долгих (замер года). Гипотезы
plan:
  items:
    - { recipe: rcp.paracetamol500.wet.v1, sku: sku.paracetamol500.n20 }
    - { recipe: rcp.paracetamol500.wet.v1, sku: sku.paracetamol500.n10 }
    - { recipe: rcp.loratadine10.wet.v1, sku: sku.loratadine10.n10 }
    - { recipe: rcp.loratadine10.wet.v1, sku: sku.loratadine10.n30 }
  cover: 21
  window: 28
  urgent: 10
# снабжение (Б2в, src/engine/supply.ts): коллега снабжения заказывает, когда запас с заказанным в пути меньше расхода плана
# на наибольший срок поставки, входной контроль 7 суток и страховой запас 7 суток; заказ — ещё на 28 суток. Гипотезы
supply: { safety: 7, every: 28, qc: 7 }
# завод не новый: износ узлов на старте, %. Техслужба меняет пуансоны по наработке — при износе 100 %, как только пресс
# свободен; плиту запайки — по отказу (docs/specs/2026-10-engine.md, 1е). Гипотезы
wear: { press-1/punches: 94, blister-1/sealplate: 85 }
maint: { press-1/punches: 100 }
# мастер линии: сменное задание — 70 % номинала узкого места за смену, если у линии есть задание на упаковку (гипотеза:
# норма выработки старой линии)
norm: 70
# политики отделов (Б4а): сверхурочные «по потребности» у всех — задачу ставят и тогда, когда она кончится после смены,
# в пределах закона; завод живёт, как жил, но платит за часы и упирается в предел года. Гипотеза
policies: { overtime: need }
# учётный период суммированного учёта у сменных графиков по циклу (Б4б): квартал — правила внутреннего распорядка завода
# (ст. 104 ТК РФ, ч. 4: до года); практика советует наибольший, а квартал раньше показывает итог в кассе. Гипотеза
account: 3
# склад ГП на старте (Б1г; геймдизайн, §17): завод уже работает — на стеллажах выпущенная ГП каждой позиции в обороте,
# на две недели спроса покупателей; серии произведены в рабочие дни за 40–10 суток до начала. Гипотезы
fg: { days: 14, age: [10, 40] }
# отклонения (Б1г; геймдизайн, §6.4): срок расследования по процедуре завода, сутки
deviations: { term: 30 }
# отпуска (Б4г; src/engine/leave.ts): черновик графика на следующий год кадры составляют в первый рабочий день не раньше
# 1 декабря, в 09:00; утверждают в последний рабочий день не позже 17 декабря — за две недели до года (ст. 123 ТК РФ).
# Части у каждого — 14 и 14 дней (ст. 125): первая — летом, с 1 июня по 31 августа, вторая — с 9 января по 17 декабря,
# без новогодних праздников и двух последних недель года; из отдела в отпуске сразу — не больше двух человек; доплата
# заместителю — % оклада ушедшего за дни замещения (ст. 151: по соглашению сторон). Гипотезы
leave:
  draft: [12, 1]
  approve: [12, 17]
  parts: [14, 14]
  summer: [[6, 1], [8, 31]]
  rest: [[1, 9], [12, 17]]
  dept: 2
  cover: 30
# рынок труда города (Б4в; геймдизайн, §8.4): уровень оплаты роли — её оклад в базе. Объявление — ₽ в неделю; кадровое
# агентство — % годового оклада принятого, опытный кандидат (навык от и до) через столько-то суток; медосмотр при приёме —
# рабочих дней и ₽; кандидат ищет работу `wait` суток; ожидание — уровень роли, выше на `step` % за ступень навыка выше 3
# и ниже — за ступень ниже, с разбросом `spread` %; выплата по соглашению сторон — окладов; испытание по умолчанию —
# месяцев; на испытании уходят чаще в `trial` раз. Коллега берёт кандидата с навыком не ниже `skill` и ожиданием не выше
# уровня роли на `over` %, через агентство — если по объявлению `ad` суток никого. По ролям: доли недель с 0, 1, 2 и 3
# откликами на объявление, %; доли навыков 1–5, %; уходят по собственному желанию — % людей роли в год. Город небольшой:
# уполномоченного лица и начальника ОКК по объявлению не найти. Гипотезы: открытых данных нет (docs/10-domain.md, §8)
labor:
  ad: 5000
  agency: { share: 20, days: [14, 28], skill: [4, 5] }
  medical: { days: 3, price: 4500 }
  wait: 14
  step: 8
  spread: 5
  agree: 2
  probation: 3
  trial: 3
  colleague: { skill: 3, over: 10, ad: 14 }
  roles:
    role.storekeeper: { ad: [30, 40, 25, 5], skill: [10, 30, 40, 15, 5], quit: 8 }
    role.driver: { ad: [30, 40, 25, 5], skill: [10, 30, 40, 15, 5], quit: 8 }
    role.sampler: { ad: [50, 35, 15, 0], skill: [10, 30, 40, 15, 5], quit: 6 }
    role.analyst: { ad: [55, 35, 10, 0], skill: [10, 30, 40, 15, 5], quit: 6 }
    role.qc-head: { ad: [100, 0, 0, 0], skill: [0, 0, 30, 50, 20], quit: 4 }
    role.qa: { ad: [70, 25, 5, 0], skill: [5, 25, 40, 25, 5], quit: 5 }
    role.qp: { ad: [100, 0, 0, 0], skill: [0, 0, 30, 50, 20], quit: 3 }
    role.operator: { ad: [40, 35, 20, 5], skill: [15, 30, 35, 15, 5], quit: 8 }
    role.master: { ad: [70, 25, 5, 0], skill: [5, 20, 45, 25, 5], quit: 5 }
    role.line-operator: { ad: [40, 35, 20, 5], skill: [15, 30, 35, 15, 5], quit: 8 }
    role.packer: { ad: [25, 40, 25, 10], skill: [20, 35, 30, 10, 5], quit: 10 }
    role.mechanic: { ad: [60, 30, 10, 0], skill: [5, 25, 40, 25, 5], quit: 6 }
    role.setter: { ad: [70, 25, 5, 0], skill: [5, 25, 40, 25, 5], quit: 6 }
    role.cleaner: { ad: [25, 40, 25, 10], skill: [20, 35, 30, 10, 5], quit: 10 }
# обучение (Б3б): задача обучения — за `ahead` суток до введения новой редакции документа или до конца срока записи;
# проверка знаний — `check` минут специалиста ООК или начальника ОКК; на старте все допущены, дни обучения — до `spread`
# суток назад, у каждой записи свой; табельные номера — по порядку приёма с `tab`. Гипотезы
training: { ahead: 14, check: 15, spread: 330, tab: 1001 }
# места и оборудование (Б3в): калибровку, поверку и повторную квалификацию ведёт подрядчик — визит назначает коллега
# техслужбы за `ahead` суток до конца записи, на ближайший рабочий день; подрядчик работает с `hours[0]` до `hours[1]`
# часов; работу принимает начальник ОКК или специалист ООК — `accept` минут; на старте дни записей — в прошлом, у каждой
# свой по хешу актива; инвентарные номера — по порядку мест с `inv`. Гипотезы
assets: { ahead: 14, hours: [9, 17], accept: 15, inv: 101 }
# контрагенты и договоры (Б3г): одобрение пары «поставщик — изготовитель» коллега качества продлевает за `ahead` суток до
# конца; снова оценивают через `every` месяцев — у АФС и вспомогательных веществ аудитом изготовителя, у упаковки по
# документам; аудит — `days` рабочих дней стороннего аудитора у изготовителя, отчёт специалист ООК рассматривает `review`
# часов, цена аудита — ₽ без НДС; оценка по документам — `docs.review` часов. Рамочный договор с поставщиком — на
# `months` месяцев: сверх обещанного — по прайсу, дороже на `markup` %; купили по паре меньше `share` % обещанного (по
# стоимости, строки материалов пары вместе) — поставщик возвращает скидку счётом. На старте объём — по плану выпуска, пока
# спроса не видно: позиции поровну; так по паре выходит 63–111 % обещанного за первый год (замер Б3г), и `share` ниже
# этого. Номера договоров — по порядку с `ctr`. Всё — гипотезы
partners:
  ahead: 30
  every: { api: 24, excipient: 36, packaging: 12 }
  audit: { days: 3, review: 4, price: 350000 }
  docs: { review: 3 }
  markup: 10
  share: 50
  months: 12
  ctr: 1
# места игрока (docs/specs/2026-10-panels.md, 3е; решение владельца по #30): директор, производство, качество и
# технология; снабжение и склад и коммерцию ведут коллеги и сценарий — заказы поставщикам пишет коллега снабжения (Б2в),
# заказы покупателей — сценарий
seats: [director, production, quality]
# происшествие (docs/specs/2026-10-investigation.md, часть 4): у второго задания на серию — неисправность по жребию зерна;
# веса корней, % и величины — гипотезы: ошибка лаборатории — на 16–20 % ниже истинного, опудривание — на 11–14 мин дольше
# цели, сила прессования — на 11–13 кН выше цели, сито — на 1 мм крупнее карты. Крупной фракции АФС корнем быть не может:
# обе первые серии — из одной партии парацетамола
incident:
  batch: 2
  inv: inv.dissolution
  roots: { lab: 30, lube: 25, force: 15, screen: 30 }
  sizes: { lab: [16, 20], lube: [11, 14], force: [11, 13], screen: [1, 1] }
# запас на старте — разрешённые партии на стеллажах: АФС — на срок его поставки и входной контроль при серии в рабочий
# день, остальное — на шесть недель. Гипотезы
stock:
  - { material: mat.api.paracetamol, qty: 6000 }
  - { material: mat.exc.starch, qty: 400 }
  - { material: mat.exc.povidone, qty: 100 }
  - { material: mat.exc.mcc, qty: 140 }
  - { material: mat.exc.mgst, qty: 40 }
  - { material: mat.pk.pvc, qty: 600 }
  - { material: mat.pk.alu, qty: 300 }
  - { material: mat.pk.carton-n10, qty: 320000 }
  - { material: mat.pk.carton-n20, qty: 160000 }
  - { material: mat.pk.leaflet, qty: 480000 }
  - { material: mat.pk.case, qty: 2700 }
  # лоратадин (Б2б): субстанция — на срок её поставки и входной контроль при трети серий, остальное — на шесть недель
  - { material: mat.api.loratadine, qty: 50 }
  - { material: mat.exc.lactose, qty: 400 }
  - { material: mat.pk.carton-l10, qty: 100000 }
  - { material: mat.pk.carton-l30, qty: 50000 }
  - { material: mat.pk.leaflet-lor, qty: 150000 }
