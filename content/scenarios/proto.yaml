# Завод прототипа (docs/specs/2026-10-prototype.md, «Что в прототипе»; docs/specs/2026-10-engine.md). Штат, техника,
# запас и первые заказы — гипотезы геймдизайна. Касса — рубли.
id: scn.proto
name: { ru: Прототип, en: Prototype }
profile: prf.eaeu
plant: plant.proto
start: { date: 2027-09-01, hour: 7 }
seed: 20271001
site: { w: 60, h: 40 }
cash: 30000000
# кредитная линия: предел минуса, ₽, и надбавка к ключевой ставке, п. п. (около средней ставки банков, cbr-rates);
# цена электроэнергии, ₽ за кВт·ч без НДС, — в пределах цен 2026 года (tosk-2026). Гипотезы
credit: { limit: 20000000, spread: 4 }
energy: { price: 9.5 }
customers: [cus.national, cus.regional]
# штат — под загрузку плана (Б2в): серия в рабочий день отвешивается в первую смену вдвоём, во вторую стадии ведёт один
# аппаратчик; линия упаковывает серию за 3–4 часа — её смена только первая; при прежнем штате люди были заняты задачами
# пятую часть смены (замер Б2в). Гипотезы
staff:
  - { role: role.storekeeper, shift: shift.day, skill: 3, n: 1 }
  - { role: role.driver, shift: shift.day, skill: 3, n: 1 }
  - { role: role.sampler, shift: shift.day, skill: 3, n: 1 }
  - { role: role.analyst, shift: shift.day, skill: 3, n: 2 }
  - { role: role.qc-head, shift: shift.day, skill: 4, n: 1 }
  - { role: role.qa, shift: shift.day, skill: 3, n: 1 }
  - { role: role.qp, shift: shift.day, skill: 4, n: 1 }
  - { role: role.operator, shift: shift.a, skill: 3, n: 2 }
  - { role: role.operator, shift: shift.b, skill: 3, n: 1 }
  - { role: role.master, shift: shift.a, skill: 4, n: 1 }
  - { role: role.master, shift: shift.b, skill: 3, n: 1 }
  - { role: role.line-operator, shift: shift.a, skill: 3, n: 2 }
  - { role: role.packer, shift: shift.a, skill: 3, n: 2 }
  - { role: role.mechanic, shift: shift.a, skill: 3, n: 1 }
  - { role: role.mechanic, shift: shift.b, skill: 3, n: 1 }
  - { role: role.setter, shift: shift.day, skill: 3, n: 1 }
vehicles:
  - { type: veh.jack, n: 2 }
  - { type: veh.reach, n: 1 }
# задания на серию первых двух недель — по серии в рабочий день, день — от начала партии, и позиция, в которую упаковать
# балк; три из десяти — лоратадин (Б2б), вторая — парацетамол: на ней происшествие. Дальше задания ставит коллега
# планирования (plan). Гипотезы
batches:
  - { recipe: rcp.paracetamol500.wet.v1, day: 1, sku: sku.paracetamol500.n20 }
  - { recipe: rcp.paracetamol500.wet.v1, day: 2, sku: sku.paracetamol500.n20 }
  - { recipe: rcp.paracetamol500.wet.v1, day: 5, sku: sku.paracetamol500.n10 }
  - { recipe: rcp.loratadine10.wet.v1, day: 6, sku: sku.loratadine10.n30 }
  - { recipe: rcp.paracetamol500.wet.v1, day: 7, sku: sku.paracetamol500.n20 }
  - { recipe: rcp.paracetamol500.wet.v1, day: 8, sku: sku.paracetamol500.n10 }
  - { recipe: rcp.loratadine10.wet.v1, day: 9, sku: sku.loratadine10.n10 }
  - { recipe: rcp.paracetamol500.wet.v1, day: 12, sku: sku.paracetamol500.n20 }
  - { recipe: rcp.loratadine10.wet.v1, day: 13, sku: sku.loratadine10.n30 }
  - { recipe: rcp.paracetamol500.wet.v1, day: 14, sku: sku.paracetamol500.n20 }
# план выпуска (Б2в, src/engine/planner.ts): после заданий сценария их ставит коллега планирования — на тот же день через
# две недели, если ГП позиции с сериями в работе меньше спроса на эти две недели и ещё 21 суток; спрос — по заказам за 28
# последних суток. С двумя продуктами серия позиции покрывает до двух недель спроса, и запаса на 14 суток не хватало (Б2б).
# Гипотезы
plan:
  items:
    - { recipe: rcp.paracetamol500.wet.v1, sku: sku.paracetamol500.n20 }
    - { recipe: rcp.paracetamol500.wet.v1, sku: sku.paracetamol500.n10 }
    - { recipe: rcp.loratadine10.wet.v1, sku: sku.loratadine10.n10 }
    - { recipe: rcp.loratadine10.wet.v1, sku: sku.loratadine10.n30 }
  cover: 21
  window: 28
# снабжение (Б2в, src/engine/supply.ts): коллега снабжения заказывает, когда запас с заказанным в пути меньше расхода плана
# на наибольший срок поставки, входной контроль 7 суток и страховой запас 7 суток; заказ — ещё на 28 суток. Гипотезы
supply: { safety: 7, every: 28, qc: 7 }
# завод не новый: износ узлов на старте, %. Техслужба меняет пуансоны по наработке — при износе 100 %, как только пресс
# свободен; плиту запайки — по отказу (docs/specs/2026-10-engine.md, 1е). Гипотезы
wear: { press-1/punches: 94, blister-1/sealplate: 85 }
maint: { press-1/punches: 100 }
# мастер линии: сменное задание — 70 % номинала узкого места за смену, если у линии есть задание на упаковку (гипотеза:
# норма выработки старой линии)
norm: 70
# места игрока (docs/specs/2026-10-panels.md, 3е; решение владельца по #30): директор, производство, качество и
# технология; снабжение и склад и коммерцию ведут коллеги и сценарий — заказы поставщикам пишет коллега снабжения (Б2в),
# заказы покупателей — сценарий
seats: [director, production, quality]
# происшествие (docs/specs/2026-10-investigation.md, часть 4): у второго задания на серию — неисправность по жребию зерна;
# веса корней, % и величины — гипотезы: ошибка лаборатории — на 16–20 % ниже истинного, опудривание — на 11–14 мин дольше
# цели, сила прессования — на 11–13 кН выше цели, сито — на 1 мм крупнее карты. Крупной фракции АФС корнем быть не может:
# обе первые серии — из одной партии парацетамола
incident:
  batch: 2
  inv: inv.dissolution
  roots: { lab: 30, lube: 25, force: 15, screen: 30 }
  sizes: { lab: [16, 20], lube: [11, 14], force: [11, 13], screen: [1, 1] }
# запас на старте — разрешённые партии на стеллажах: АФС — на срок его поставки и входной контроль при серии в рабочий
# день, остальное — на шесть недель. Гипотезы
