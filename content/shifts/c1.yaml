# 2/2 по 12 часов в четыре бригады (Б4б; docs/specs/2026-10-vertical-slice.md, «Б4б»): день 08:00–20:00, ночь
# 20:00–08:00, дни и ночи по очереди — «день, день, два выходных, ночь, ночь, два выходных» (docs/10-domain.md, §2:
# ppt-shifts); условия законности — часы за учётный период не больше нормы, не две смены подряд, непрерывный отдых не
# меньше 42 ч в неделю (oi-12h, oi-44). Бригады сдвинуты на два дня: в любые сутки одна работает днём, другая ночью. Цикл
# не смотрит на производственный календарь — смены идут и в праздники (ст. 113 ТК РФ). Ночная смена уравнена с дневной
# по условиям труда (ст. 96, ч. 3), отдых и еда — в рабочее время (ст. 108, ч. 3); учёт — суммированный, за учётный
# период сценария. Часы, рисунок и день отсчёта — гипотезы
id: shift.c1
name: { ru: "12 ч, бригада 1", en: "12 h, crew 1" }
cycle:
  from: 2027-09-01
  offset: 0
  pattern: [day, day, off, off, night, night, off, off]
  day: [8, 20]
  night: [20, 8]
