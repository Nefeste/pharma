# Процедуры (СОП, Б3б; docs/specs/2026-10-vertical-slice.md): регламентирующие документы с шапкой Б3а. У процедуры — роли,
# которые по ней учатся (строка матрицы обучения), работы, которым она нужна (`for`: виды задач, классы оборудования
# стадий, машины линии, техника; `any` — любая работа, кроме самого обучения), часы на изучение и срок, через который
# учатся снова, — месяцы. Учить всех, кто бывает в производстве, на складе и в лаборатории, первично и непрерывно, с
# записями; необученных в зоны производства и контроля не допускают (GMP ЕАЭС, ч. I, пп. 2.10–2.13). Названия, часы и сроки
# — гипотезы.
