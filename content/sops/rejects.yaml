# Обращение с отклонёнными материалами (Б1з): вынос отклонённого балка из промежуточного склада, погрузка отклонённого
# на вывоз и подпись передачи подрядчику. Отклонённое хранят раздельно и возвращают, перерабатывают или уничтожают;
# любое действие оформляют документально и утверждают лица с полномочиями (GMP ЕАЭС, ч. I, п. 5.66); одобряет и
# отклоняет материалы и продукцию руководитель контроля качества (п. 2.8 i). Отходы производства ЛС — медицинские отходы
# класса «Г»; к работе с ними допускают после инструктажа (СанПиН 2.1.3684-21, пп. 157, 166). Название, часы и срок —
# гипотезы.
