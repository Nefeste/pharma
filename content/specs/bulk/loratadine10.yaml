# Спецификация балка лоратадина. Однородность дозирования: 10 мг ниже порога 25 мг — однородность массы её не заменяет;
# приемлемое значение AV по 10 таблеткам не больше L1 = 15,0, вторую ступень (ещё 20) прототип не играет (jp-602,
# ich-q4b-a6). Растворение — по ОФС «Растворение» ГФ XV: первая ступень, каждая из 6 таблеток не меньше Q + 5 % = 80 % за
# 45 мин, движок сравнивает среднее. Пределы содержания и влажности — гипотезы до НД продукта.
id: spec.bulk.loratadine10
tests:
  - { test: test.hplc-assay, min: 95, max: 105 }
  - { test: test.uniformity, max: 15 }
  - { test: test.dissolution, min: 80 }
  - { test: test.lod, max: 3 }
source: [gf-15, jp-602, ich-q4b-a6]
review: draft
