# Входной контроль АФС лоратадина. Пределы — гипотезы прототипа, как у парацетамола: настоящие — по фармакопейной
# статье и спецификации изготовителя, в ней ещё и распределение частиц по размерам (meb-loratadine-2022).
id: spec.mat.api.loratadine
name: { ru: "Лоратадин, субстанция", en: "Loratadine, active substance" }
doc: { code: SP-0014, rev: 1, from: 2027-03-01, approved: role.qc-head }
# одобренные пары «поставщик — изготовитель» (Б3г; GMP ЕАЭС, ч. I, п. 4.14)
pairs: [{ supplier: sup.api-lor, maker: mkr.api-lor }]
# пара-кандидат (Б6ж): второй изготовитель — в досье его нет; «Одобрить пару» — документы, пробная партия, аудит и
# изменение досье типа II (reg-eaeu, прил. 19, Б.I.а.1 б) или ж)); с положительным решением пара — в спецификации
candidates: [{ supplier: sup.api-lor2, maker: mkr.api-lor2 }]
tests:
  - { test: test.ir }
  - { test: test.hplc-assay, min: 98.5, max: 101.5 }
  - { test: test.lod, max: 0.5 }
